<title>SWEAT4 – Trainer-Logbuch</title>
<style>
:root{
  /* SWEAT4-Markenfarben: Schwarz & Gold matt */
  --bg:#0b0b0b; --surface:#151515; --surface-2:#1c1c1c; --surface-3:#272727; --border:#2f2f2f;
  --text:#f2efe9; --muted:#9a948a; --accent:#be9b5c; --accent-ink:#111111; --accent-soft:rgba(190,155,92,.14);
  --danger:#ff6b6b; --danger-soft:rgba(255,107,107,.12); --ok:#4ade80; --warn:#fbbf24; --radius:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh}
body.modal-open{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}
.muted{color:var(--muted)}
.accent{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.view{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Topbar */
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar-bg);color:var(--text);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:60px}
.tb-title{flex:1;min-width:0}
.tb-h{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;flex:none}
.brand .logo-mark{height:34px;width:auto;display:block}
@media(max-width:420px){.brand .logo-mark{height:26px}.topbar-in>.icon-btn:not(:first-child),.topbar-in>a.icon-btn:not(:first-child){width:40px}}
.home-logo{display:flex;justify-content:center;margin:6px 0 20px;background:var(--hero-bg);border-radius:20px;padding:var(--hero-pad)}
.home-logo .logo-full{width:min(300px,78vw);height:auto;display:block}
.tb-extra{max-width:780px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--surface-2);font-weight:600;cursor:pointer;transition:transform .08s,background .15s,opacity .15s;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-primary{background:var(--accent-fill);color:var(--accent-ink)}
.btn-ghost{background:var(--surface-2);border-color:var(--border)}
.btn-text{background:none;color:var(--muted);padding:0 10px}
.btn-danger{background:var(--danger);color:#1a0505}
.btn-danger-ghost{background:var(--danger-soft);color:var(--danger)}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px}
.btn-big{width:100%;min-height:64px;font-size:19px;border-radius:16px}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:none;border:none;cursor:pointer;color:var(--text)}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.sm{width:38px;height:38px;border-radius:10px}
.icon-btn.danger{color:var(--danger)}
.icon-btn:disabled{opacity:.25;pointer-events:none}

/* Cards & layout */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.section{margin-top:26px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-h h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stats.four{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0}
.stat-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat-v{font-size:19px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--ok)} .down{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.banner b{color:var(--warn)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.live{background:rgba(74,222,128,.14);color:var(--ok)}
.info{font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:12px 14px}
.note-box{white-space:pre-wrap;word-break:break-word}

/* Home */
.search-row{display:flex;gap:10px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;height:48px;font-size:17px;color:var(--text)}
.sort-row{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-size:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface-3);color:var(--text)}
.client-list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.client-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.client-card{min-width:0;display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;transition:border-color .15s,transform .08s;position:relative}
.client-card:active{transform:scale(.985)}
.client-card:hover{border-color:var(--border-strong)}
.cc-name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-meta{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-meta b{color:var(--text);font-weight:600}
.cc-tags{position:absolute;top:10px;right:12px;display:flex;gap:6px}
.btn-next{justify-content:flex-start;text-align:left;gap:14px;padding:12px 18px;white-space:normal;height:auto}
.btn-next .nx-ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(17,17,17,.12)}
.btn-next .nx-tx{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.btn-next small{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.btn-next b{font-size:19px;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
.box-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--accent-soft);border:1px solid var(--gold-line);margin-bottom:14px}
.box-banner b{display:block;color:var(--text)}.box-banner div div{font-size:13.5px;color:var(--text-2)}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.xl{width:76px;height:76px;font-size:26px}
.privacy-pill{display:flex;align-items:center;justify-content:center;gap:8px;margin:26px auto 0;font-size:13px;color:var(--muted);padding:10px 14px;border-radius:999px;border:1px solid var(--border);width:max-content;max-width:100%}

/* Client */
.hero{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.hero h1{font-size:24px}
.day-grid{display:grid;gap:10px}
@media(min-width:600px){.day-grid{grid-template-columns:1fr 1fr}}
.day-btn{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;min-height:72px;transition:transform .08s}
.day-btn:active{transform:scale(.98)}
.day-btn.next{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent)}
.day-no{width:40px;height:40px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;font-weight:800;flex:none}
.day-btn.next .day-no{background:var(--accent-fill);color:var(--accent-ink)}
.day-name{font-weight:700}
.list-link{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border)}
.list-link:last-child{border-bottom:none}
.list-card{padding:0;overflow:hidden}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick3{grid-template-columns:repeat(3,minmax(0,1fr))}.quick3 .btn{padding:0 8px;font-size:15px;gap:6px}
@media(max-width:380px){.quick3 .btn{flex-direction:column;gap:2px;min-height:58px;font-size:13px}}
.spark{display:block;margin-top:4px}

/* Plan editor */
.day-card{padding:0;overflow:hidden}
.day-head{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.day-head input{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:10px;padding:8px;font-weight:700;font-size:17px;outline:none}
.day-head input:focus{border-color:var(--accent);background:var(--bg)}
.ex-row{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 14px;border-bottom:1px solid var(--border)}
.ex-row:last-child{border-bottom:none}
.ex-idx{width:26px;color:var(--muted);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.ex-meta{font-size:13px;color:var(--muted)}
.day-foot{padding:10px 14px}

/* Forms */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.input,.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:17px;outline:none;transition:border-color .15s}
.field textarea{resize:vertical;min-height:70px}
.input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.radio-seg{display:flex;gap:8px}
.radio-seg label{flex:1}
.radio-seg input{position:absolute;opacity:0;pointer-events:none}
.radio-seg span{display:grid;place-items:center;height:48px;border-radius:12px;background:var(--bg);border:1px solid var(--border);font-weight:700;font-size:18px;cursor:pointer}
.radio-seg input:checked+span{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent)}
.target-row{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:8px}
.s4-card{margin-bottom:16px;border-color:rgba(190,155,92,.45)}.s4-mark{flex:none;width:58px;display:block;margin-top:3px}.s4-mark svg{width:100%;height:auto;display:block}
.s4-plan{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px}.s4-plan .chip{font-size:13px;margin:4px 4px 0 0;display:inline-block}
.ss-tag{font-size:10px;padding:2px 7px;margin-right:4px;vertical-align:1px}
.ex-card.is-ss .ex-num{font-size:13px;background:var(--accent-soft);color:var(--accent)}.ex-card.is-ss.complete .ex-num{background:var(--accent-fill);color:var(--accent-ink)}
.target-row input{text-align:center}
.step-seg span{font-size:16px}
.step-custom{display:flex;align-items:center;gap:10px;margin-top:8px}.step-custom .input{width:120px;text-align:center}
.toggle{display:flex;gap:12px;align-items:flex-start;margin:14px 0 12px;cursor:pointer;font-weight:600;font-size:15px;color:var(--text)}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .tg{flex:none;width:46px;height:28px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border);position:relative;transition:background .2s}
.toggle .tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle input:checked+.tg{background:var(--accent-soft);border-color:var(--accent)}
.toggle input:checked+.tg::after{transform:translateX(18px);background:var(--accent-fill)}
.toggle small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.goal-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goal-in label{display:grid;gap:4px;font-size:13px}.goal-in .input{text-align:center}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--accent-soft);border:1px solid rgba(190,155,92,.4);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.prog-main{font-size:16px}.prog-main b{color:var(--accent);font-size:18px;font-variant-numeric:tabular-nums}
.prog-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.prog-d{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-fill);color:var(--accent-ink);margin-left:4px}
.prog-d.hold{background:var(--surface-3);color:var(--muted)}
.prog-r{grid-column:1/-1;font-size:12.5px;color:var(--muted);line-height:1.4}
.prog-hold,.prog-goal{background:var(--surface-2);border-color:var(--border)}
.goal-box{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.gb-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:6px}
.gbar{display:flex;align-items:center;gap:10px}
.gb-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.gb-track{flex:1;height:6px;border-radius:999px;background:var(--surface-3);position:relative}
.gb-track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent-fill)}
.gb-track b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--accent)}
.gb-cur{font-size:13px;color:var(--muted);margin-top:6px}.gb-cur b{color:var(--text)}
.photo-pick{display:flex;align-items:center;gap:14px;margin-bottom:16px}

/* Modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;animation:ofade .15s}
@keyframes ofade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:22px 22px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom));animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateY(40px);opacity:.4}}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px;padding-bottom:18px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 14px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-h h2{font-size:20px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.sheet-actions .btn-primary{flex:1}
.pick-list{display:grid;gap:10px}

/* Training */
.tbar{flex:1;height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.tbar span{display:block;height:100%;background:var(--accent-fill);border-radius:99px;transition:width .3s ease}
.tcount{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;scroll-margin-top:130px;transition:border-color .2s}
.ex-card.open{border-color:var(--border-strong)}
.ex-card.complete{border-color:rgba(190,155,92,.45)}
.ex-head{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:14px;text-align:left;cursor:pointer;min-height:64px}
.ex-num{width:34px;height:34px;flex:none;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;font-weight:800;font-size:15px}
.ex-card.complete .ex-num{background:var(--accent-fill);color:var(--accent-ink)}
.ex-title{flex:1;min-width:0}
.ex-name{display:block;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-sum{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.ex-card.complete .ex-count{color:var(--accent)}
.chev{color:var(--muted);transition:transform .2s;display:grid}
.ex-card.open .chev{transform:rotate(180deg)}
.ex-body{display:none;padding:0 12px 14px}
.ex-card.open .ex-body{display:block}
.last{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.last.empty{color:var(--muted);font-size:14px;text-align:left;padding:10px 12px}
.last-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-3);border-radius:8px;padding:4px 9px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.last-note,.plan-note{font-size:14px;color:var(--muted);margin-top:6px}
.plan-note{margin:0 0 10px;color:var(--warn)}
.set-row{display:grid;grid-template-columns:54px 22px 1fr 14px 1fr 40px;gap:7px;align-items:center;margin-bottom:8px}
.check{width:54px;height:54px;border-radius:14px;border:2px solid var(--border);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:transparent;transition:background .15s,border-color .15s,transform .1s}
.check:active{transform:scale(.92)}
.set-row.done .check{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.set-n{font-weight:800;color:var(--muted);text-align:center}
.set-row.done .set-n{color:var(--accent)}
.fld{position:relative;display:block}
.fld input{width:100%;height:54px;border-radius:12px;border:1px solid var(--border);background:var(--bg);text-align:center;font-size:21px;font-weight:700;padding:0 22px 0 4px;outline:none;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--placeholder);font-weight:600}
.fld input:focus{border-color:var(--accent)}
.fld .unit{position:absolute;right:7px;bottom:7px;font-size:10px;color:var(--muted);font-weight:700;pointer-events:none;text-transform:uppercase}
.set-row.done .fld input{background:var(--accent-soft);border-color:rgba(190,155,92,.45)}
.x{text-align:center;color:var(--muted);font-weight:700}
.icon-btn.more.has{color:var(--accent)}
.set-extra{display:none;grid-template-columns:1fr 1.6fr;gap:8px;margin:-2px 0 10px 61px}
.set-extra.show{display:grid}
.set-extra input{height:44px;border-radius:10px;border:1px solid var(--border);background:var(--bg);padding:0 10px;font-size:16px;outline:none;min-width:0}
.set-extra input:focus{border-color:var(--accent)}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.ex-note{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px;resize:vertical;outline:none}
.ex-note:focus{border-color:var(--accent)}
@media(max-width:360px){.set-row{grid-template-columns:48px 16px 1fr 10px 1fr 34px;gap:5px}.check{width:48px;height:48px}.set-extra{margin-left:53px}}

/* Tables & charts */
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--border)}
.table td{padding:10px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;vertical-align:top}
.table tr:last-child td{border-bottom:none}
.table .r{text-align:right}
.chart{width:100%;display:block}
.chart .ln{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart text{fill:var(--muted);font-size:12px;font-family:inherit}
.chart .vl{fill:var(--text);font-weight:700;font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#rest-timer{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);width:min(440px,calc(100vw - 24px));background:var(--surface);border:1px solid rgba(190,155,92,.55);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:12px 12px 12px 16px;z-index:70;transition:transform .25s;overflow:hidden}
#rest-timer.show{transform:translateX(-50%) translateY(0)}
#rest-timer:not(.show){visibility:hidden;transition:transform .25s,visibility 0s .25s}
body.resting .view{padding-bottom:110px}
#rest-timer .rt-row{display:flex;align-items:center;gap:10px}
#rest-timer .rt-time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);min-width:84px}
#rest-timer .rt-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
#rest-timer .rt-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent-fill);transition:width .25s linear}
#rest-timer.done{border-color:var(--ok)}#rest-timer.done .rt-time{color:var(--ok)}
@media(max-width:420px){.hide-xs{display:none}}
/* ---------- Übungskatalog & 3D ---------- */
.chip3d{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:2px 7px;border-radius:999px;border:1px solid rgba(190,155,92,.5);background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.04em;cursor:pointer;vertical-align:2px}

.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-3)}

.ul{margin:0;padding-left:18px}.ul li+li{margin-top:5px}
.v3d{position:fixed;inset:0;z-index:60;background:#0b0b0b;display:flex;flex-direction:column;animation:fade .2s ease-out}

.v3d-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px;z-index:1}

.v3d-zoom .icon-btn{background:rgba(28,28,28,.85);border:1px solid var(--border);font-size:24px;font-weight:600;line-height:1}
.v3d-legend{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12px;background:rgba(11,11,11,.75);border:1px solid var(--border);border-radius:10px;padding:7px 10px;max-width:calc(100% - 20px)}

.v3d-bar{padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.v3d-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}

.v3d-info{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;z-index:3;background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:16px 16px 20px;animation:slide .22s cubic-bezier(.2,.8,.2,1)}

.mcard.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(190,155,92,.12),rgba(190,155,92,.02))}

.mc-s{font-size:12.5px;color:var(--muted);margin-top:2px}.mc-s b{color:var(--accent)}
.seg-scroll{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}.seg-scroll::-webkit-scrollbar{display:none}.seg-scroll button{flex:none}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.rstats>div{background:var(--surface-2);border-radius:12px;padding:9px 10px;min-width:0}
.rstats span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.rstats b{font-size:16px;font-variant-numeric:tabular-nums}.rstats small{font-size:12px}
.ba-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ba{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/4}
.ba img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.ba span{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:700;background:rgba(11,11,11,.72);border-radius:8px;padding:4px 8px}

.tl{position:relative;padding-left:22px}

.hscroll{overflow-x:auto}

/* ===================== REDESIGN · Design-Tokens ===================== */
/* Layout: dunkle Flächen mit feinem Verlauf, Gold nur für Aktives und Wichtiges */
:root{
  --bg:#090909; --surface:#141414; --surface-2:#1b1b1a; --surface-3:#262523; --border:#2a2826; --border-strong:#3a3631;
  --gold:#c7a46a; --gold-deep:#9c7b45; --gold-line:rgba(199,164,106,.45); --gold-glow:rgba(199,164,106,.22);
  --accent:#c7a46a; --accent-soft:rgba(199,164,106,.13);
  --card-grad:linear-gradient(180deg,#171716 0%,#111110 100%);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --radius:16px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --ease:cubic-bezier(.2,.7,.2,1); --t-fast:.14s; --t-mid:.24s;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
  --font-display:"SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.card,.ex-card,.client-card,.day-btn{background:var(--card-grad);box-shadow:var(--shadow)}
.wrap-wide{max-width:1180px}

/* Bedienung: Press-Zustand mobil, goldener Rand am Desktop */
.tap{transition:transform var(--t-fast) var(--ease),border-color var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease);-webkit-user-select:none;user-select:none}
.tap:active{transform:scale(.975)}
@media (hover:hover){
  .tap:hover,.client-card:hover,.day-btn:hover{border-color:var(--gold-line)}
  .xcard:hover .thumb-img{transform:scale(1.04)}
}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:var(--surface-3);color:var(--text);white-space:nowrap}
.pill-gold{background:var(--accent-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}

/* SectionHeader */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sh h2{margin:0;font:800 13px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
.sh-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* FilterChip */
.kat-tools{display:grid;gap:10px;margin-bottom:14px}
.frow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;scroll-padding:16px;align-items:center}
.frow::-webkit-scrollbar{display:none}
.frow-l{flex:none;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-weight:650;font-size:14px;cursor:pointer;transition:all var(--t-fast) var(--ease)}
.fchip:active{transform:scale(.96)}
.fchip.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.fchip-n{font-size:11px;font-weight:800;opacity:.65;font-variant-numeric:tabular-nums}
.frow-sub .fchip{min-height:32px;font-size:13px;padding:0 12px}
.frow-sub .fchip.on{background:var(--accent-soft);color:var(--gold);border-color:var(--gold-line)}
@media (hover:hover){.fchip:not(.on):hover{border-color:var(--gold-line);color:var(--text)}}
.kat-status{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;margin-bottom:6px;font-size:14px;color:var(--muted)}
.kat-status b{color:var(--text);font-variant-numeric:tabular-nums}
.kat-reset{display:inline-flex;align-items:center;gap:4px;min-height:36px;border:none;cursor:pointer;font-weight:650;color:var(--gold)}
.kat-sec{margin-top:22px}

/* ExerciseCard + ExercisePreview */
.xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.xgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(min-width:960px){.xgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.xcard-media{aspect-ratio:4/3}}
@media(max-width:340px){.xgrid{grid-template-columns:1fr}}
.xcard{display:flex;flex-direction:column;min-width:0;background:var(--card-grad);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.xcard-media{position:relative;aspect-ratio:1/1;max-width:100%}
.xprev{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#1f1d1a 0%,#0e0e0e 70%)}
.xprev-ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(199,164,106,.28)}
.xprev.is-loading::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(199,164,106,.08) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.thumb-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s var(--ease),transform .5s var(--ease)}
.thumb-img.in{opacity:1}
.xcard-group{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(9,9,9,.72);color:var(--gold);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.xcard-play{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(9,9,9,.72);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.xcard-play svg{margin-left:2px}
.xcard-body{display:grid;gap:4px;padding:10px 12px 12px;min-width:0}
.xcard-name{font:700 15px/1.25 var(--font-display);overflow-wrap:break-word;hyphens:auto}
.xcard-meta{font-size:12.5px;color:var(--muted);line-height:1.3}
.xcard-eq{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--gold-deep);text-transform:uppercase;margin-top:2px}

/* EmptyState · LoadingState */
.empty-state{display:grid;justify-items:center;gap:8px;text-align:center;padding:36px 16px;color:var(--muted)}
.es-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--gold)}
.es-t{font-weight:750;color:var(--text);font-size:17px}
.es-x{max-width:36ch;font-size:14px}
.empty-state .btn{margin-top:6px}
.loading-state{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ExerciseDetailView */
.ud{display:grid;gap:18px}
.ud-hero{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);background:#0b0b0b;aspect-ratio:4/3;max-width:100%}
@media(min-width:900px){.ud-hero{aspect-ratio:16/8}}
.ud-stage{position:absolute;inset:0}
.ud-stage canvas{position:relative;z-index:1}
.ud-stage.ready .ud-poster{opacity:0;transition:opacity .4s}
.ud-load{position:absolute;left:0;right:0;bottom:16px;z-index:2;display:flex;justify-content:center}
.ud-load .loading-state{background:rgba(9,9,9,.75);padding:8px 14px;border-radius:999px}
.ud-phase{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(9,9,9,.72);padding:5px 10px;border-radius:999px;pointer-events:none}
.ud-phase:empty{display:none}
.ud-ctrl{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:8px}
.icon-btn.glass{background:rgba(9,9,9,.72);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:50%}
.ud-head{display:grid;gap:8px}
.ud-tags{display:flex;flex-wrap:wrap;gap:6px}
.ud-title{margin:0;font:800 clamp(24px,6vw,34px)/1.12 var(--font-display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
.ud-sub{color:var(--muted)}
.ud-grid{display:grid;gap:12px}
@media(min-width:800px){.ud-grid{grid-template-columns:1fr 1fr}}
.ud-card{background:var(--card-grad);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;min-width:0}
.ud-mus{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--border)}
.ud-mus:first-of-type{border-top:none;padding-top:0}
.ud-mus-l{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ud-steps{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:14px}
.ud-steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;column-gap:12px;row-gap:2px}
.ud-steps li::before{content:counter(st);grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--gold);font-weight:800;font-size:13px}
.ud-steps b{font-size:14px}.ud-steps span{color:var(--text-2);font-size:15px;line-height:1.5}
.ud-list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ud-list li{display:grid;grid-template-columns:24px 1fr;gap:10px;line-height:1.45}
.ud-li-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.ud-list.ok .ud-li-ic{background:rgba(74,222,128,.12);color:var(--ok)}
.ud-list.bad .ud-li-ic{background:var(--danger-soft);color:var(--danger)}
.ud-cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5}
.ud-cta .btn{box-shadow:0 10px 30px rgba(0,0,0,.55)}

/* SWEAT4 Control System + WorkoutPlanCard */
.cs-card{position:relative;margin-bottom:20px;padding:16px;border-radius:var(--r-lg);border:1px solid var(--gold-line);background:radial-gradient(140% 120% at 100% 0%,rgba(199,164,106,.12) 0%,rgba(199,164,106,0) 55%),var(--card-grad);box-shadow:var(--shadow)}
.cs-head{display:flex;gap:12px;align-items:center}
.cs-mark{flex:none;width:78px}.cs-mark svg{display:block;width:100%;height:auto}
.cs-eyebrow{font:800 12px/1 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.cs-desc{margin-top:6px;font-size:14px;color:var(--text-2);line-height:1.4}
.cs-active{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
@media(min-width:900px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{display:flex;flex-direction:column;text-align:left;min-width:0;padding:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit}
.pcard-media{position:relative;aspect-ratio:16/11;max-width:100%}
.pcard .thumb-img{object-position:50% 30%}
.pcard-who{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(9,9,9,.72);color:var(--text)}
.pcard-check{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-fill);color:var(--accent-ink);animation:pop .28s var(--ease)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.pcard-body{display:grid;gap:3px;padding:10px 12px 12px}
.pcard-title{font:800 17px/1.15 var(--font-display)}
.pcard-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard-focus{font-size:12px;color:var(--gold-deep);font-weight:700}
.pcard-cta{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:13px;font-weight:750;color:var(--gold)}
.pcard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 28px var(--gold-glow)}

/* Programm-Detail (Sheet) + TrainingDayCard */
.prog-sheet-meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tday{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);overflow:hidden}
.tday-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.tday-h .day-no{width:30px;height:30px;font-size:14px}
.tday-h b{flex:1;min-width:0}
.tday-n{font-size:12px;color:var(--muted)}
.tday-list{margin:0;padding:4px 0;list-style:none}
.tday-list li{display:grid;gap:2px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.03)}
.tday-list li:first-child{border-top:none}
.tday-x{font-weight:600;font-size:14.5px;overflow-wrap:break-word}
.tday-s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sticky-actions{flex-wrap:nowrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 6px;margin-top:14px}

/* Sanfte Übergänge */
.sheet{animation:slide var(--t-mid) var(--ease)}
.view{animation:fade var(--t-mid) var(--ease)}
@media (prefers-reduced-motion:reduce){.thumb-img,.tap,.fchip{transition:none}.xprev.is-loading::after{animation:none}}

/* Figurwahl & Video */
.figsw{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);flex:none}
.figsw button{border:none;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:700;min-height:30px;padding:0 14px;border-radius:999px;cursor:pointer;transition:background var(--t-fast) var(--ease),color var(--t-fast)}
.figsw button.on{background:var(--accent-fill);color:var(--accent-ink)}
.kat-figrow{display:flex;align-items:center;gap:10px}
.ud-tags{align-items:center}
.ud-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b0b0b}

/* Videoplayer */
.ud-vstage{position:absolute;inset:0;display:grid;place-items:center;background:#0b0b0b}
.ud-vstage .ud-video{object-fit:contain}
.ud-src{position:absolute;left:12px;bottom:12px;z-index:3;font-size:11px;color:var(--muted);background:rgba(9,9,9,.72);padding:4px 9px;border-radius:999px}
.ud-novideo{display:grid;justify-items:center;gap:6px;text-align:center;padding:16px;color:var(--muted)}
.ud-novideo svg{color:var(--gold-deep)}.ud-novideo b{color:var(--text)}
.xprev-video .xprev-ph{color:rgba(199,164,106,.4)}
[hidden]{display:none!important}

/* Ernährung */
.nut{display:grid;gap:14px;border-color:var(--gold-line);background:radial-gradient(120% 120% at 100% 0%,rgba(199,164,106,.10) 0%,rgba(199,164,106,0) 55%),var(--card-grad)}
.nut-empty{color:var(--muted);font-size:15px}
.nut-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nut-eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.nut-kcal{font:800 34px/1.1 var(--font-display);margin-top:6px;font-variant-numeric:tabular-nums}
.nut-kcal small{font-size:14px;font-weight:600;color:var(--muted)}
.nut-sub{font-size:13px;color:var(--muted);margin-top:4px}
.nut-water{flex:none;display:grid;justify-items:center;gap:2px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);min-width:76px}
.nut-water b{font-size:18px;font-variant-numeric:tabular-nums}.nut-water small{font-size:11px;color:var(--muted)}
.nut-drop{width:14px;height:18px;background:#6fa8dc;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:rotate(180deg);opacity:.85}
.nut-phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nut-ph{padding:7px 6px;border-radius:10px;text-align:center;font-size:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.nut-ph.past{color:var(--gold-deep)}
.nut-ph.on{background:var(--accent-soft);color:var(--gold);border-color:var(--gold-line)}
.nut-macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nut-m{padding:10px;border-radius:var(--r-md);background:var(--surface-2);border-top:3px solid var(--border);min-width:0}
.nut-m.p{border-top-color:var(--gold)}.nut-m.c{border-top-color:#8f8a80}.nut-m.f{border-top-color:#6b5a3e}
.nut-m-l{font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nut-m-v{font:800 22px/1.2 var(--font-display);font-variant-numeric:tabular-nums}.nut-m-v small{font-size:12px;color:var(--muted)}
.nut-m-k{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nut-foot{font-size:12px;color:var(--muted);line-height:1.5}

/* Mahlzeiten */
.food-sum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.food-kcal{font:800 30px/1.1 var(--font-display);margin-top:4px;font-variant-numeric:tabular-nums}.food-kcal small{font-size:14px;color:var(--muted)}
.food-mac{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.food-mac b{color:var(--text);font-variant-numeric:tabular-nums}
.rhythm{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;cursor:pointer;margin-bottom:12px}
.rhythm .grow{display:grid;gap:2px;min-width:0}.rhythm .muted{font-size:13px}
.daysw{margin-bottom:12px}
.food-warn,.food-hint{font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:12px;margin-bottom:8px}
.food-warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-line)}
.food-hint{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.timeline{display:grid;gap:10px;margin-top:6px}
.meal{border:1px solid var(--border);border-radius:var(--r-md);background:var(--card-grad);overflow:hidden}
.meal.open{border-color:var(--gold-line)}
.meal-h{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:none;border:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.meal-h>svg{flex:none;color:var(--muted);transition:transform var(--t-fast)}.meal.open .meal-h>svg{transform:rotate(180deg)}
.meal-time{flex:none;min-width:54px;font:800 16px/1 var(--font-display);color:var(--gold);font-variant-numeric:tabular-nums}
.meal-h .grow{display:grid;gap:3px;min-width:0}
.meal-t{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.meal-t .pill{font-size:10.5px;padding:2px 8px}
.meal-s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal-ok{flex:none;font-size:12px;font-weight:700;color:var(--ok)}.meal-ok.empty{color:var(--muted)}
.meal-b{display:none;padding:0 12px 14px;gap:12px}.meal.open .meal-b{display:grid}
.meal-tip{font-size:13px;color:var(--gold);background:var(--accent-soft);padding:8px 10px;border-radius:10px}
.mbars{display:grid;gap:8px}
.mb-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.mb-h b{color:var(--text);font-variant-numeric:tabular-nums}
.mb-t{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.mb-t i{display:block;height:100%;background:var(--gold-deep);border-radius:99px;transition:width .3s}.mb-t i.ok{background:var(--ok)}.mb-t i.over{background:#e07b5a}
.mitems{display:grid;gap:6px}
.mitem{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 8px;border-radius:10px;background:var(--surface-2)}
.mi-dot{width:8px;height:8px;border-radius:50%;flex:none}.k-p{background:var(--accent-fill)}.k-c{background:#8f8a80}.k-v{background:var(--ok)}.k-f{background:#6b5a3e}
.mi-n{font-size:14px;min-width:0;overflow-wrap:break-word}.mi-n small{color:var(--muted);margin-left:4px}
.mi-g{display:flex;align-items:center;gap:4px;flex:none}.mi-g input{width:64px;height:38px;text-align:right;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 8px;font-variant-numeric:tabular-nums}.mi-g span{font-size:12px;color:var(--muted)}
.madd{display:flex;gap:6px;flex-wrap:wrap}.madd .fchip{min-height:32px;font-size:13px;padding:0 10px}
.mact{display:flex;gap:8px;flex-wrap:wrap}.mact .btn{min-height:42px;flex:1 1 auto}
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-md);border:1px dashed var(--gold-line);background:rgba(199,164,106,.05)}
.food-opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;cursor:pointer}
.food-opt .grow{display:grid;gap:2px;min-width:0}.food-opt .muted{font-size:12.5px}
.wdays{display:flex;gap:6px;flex-wrap:wrap}.wdays label{position:relative}.wdays input{position:absolute;opacity:0;pointer-events:none}
.wdays span{display:grid;place-items:center;width:42px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-weight:700;font-size:14px;cursor:pointer}
.wdays input:checked+span{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent-fill)}
.wdays input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

/* Rechtliches */
.legal-tabs{margin-bottom:14px}.legal-tabs .fchip{text-decoration:none}
.legal{line-height:1.6;font-size:15px}.legal h2{font:800 22px/1.2 var(--font-display);margin:0 0 6px}
.legal h3{font-size:14px;letter-spacing:.04em;margin:20px 0 6px;color:var(--gold)}
.legal p{margin:0 0 8px;color:var(--text-2);overflow-wrap:anywhere}.legal ul{margin:0 0 8px;padding-left:20px;color:var(--text-2)}.legal li{margin-bottom:6px}
.consent-txt{white-space:pre-wrap;font:14px/1.55 inherit;font-family:inherit;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0;color:var(--text);user-select:text;-webkit-user-select:text}
.legal-links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.legal-links a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.consent-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-bg);border:1px solid var(--warn-line);margin-top:16px;font-size:13.5px;color:var(--warn-text)}
.consent-banner b{display:block;color:var(--warn-strong);font-size:14.5px;margin-bottom:2px}
.toggle.need .tg{box-shadow:0 0 0 2px #f3a65a}

/* ===================== FARBWELT: Schwarz & Gold (Standard) · Sand & Gold mit Schwarz (hell) =====================
   Layout: Schwarz und Logo-Gold als Marke; die helle Variante nutzt Sandflächen mit schwarzer Schrift und schwarzer Kopfzeile */
:root{
  --bg:#EFE7D8; --surface:#FAF6EE; --surface-2:#F3ECDF; --surface-3:#E8DCC6; --border:#DACDB4; --border-strong:#C6B699;
  --text:#141414; --text-2:#383633; --muted:#6B655C; --placeholder:#A39B8E;
  --accent:#86652F; --gold:#86652F; --gold-deep:#74572A; --accent-fill:#BE9B5C; --accent-ink:#111111; --accent-soft:rgba(190,155,92,.20);
  --gold-line:rgba(134,101,47,.38); --gold-glow:rgba(190,155,92,.30);
  --ok:#2F7D4C; --danger:#B4413A; --danger-soft:rgba(180,65,58,.10); --warn:#A8740E;
  --warn-text:#7A5712; --warn-strong:#5C420B; --warn-bg:rgba(214,160,52,.14); --warn-line:rgba(176,128,30,.38);
  --card-grad:linear-gradient(180deg,#FCF9F3 0%,#F6EFE3 100%);
  --shadow:0 1px 2px rgba(20,20,20,.06),0 8px 22px rgba(20,20,20,.08);
  --topbar-bg:#0B0B0B; --hero-bg:#0B0B0B; --hero-pad:22px 16px;
  color-scheme:light;
}

  --gold-line:rgba(199,164,106,.45); --gold-glow:rgba(199,164,106,.22);
  --ok:#4ade80; --danger:#ff6b6b; --danger-soft:rgba(255,107,107,.12); --warn:#fbbf24;
  --warn-text:#f3d27a; --warn-strong:#f8e3a6; --warn-bg:rgba(251,191,36,.10); --warn-line:rgba(251,191,36,.32);
  --card-grad:linear-gradient(180deg,#171716 0%,#111110 100%);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
  --topbar-bg:rgba(11,11,11,.9); --hero-bg:transparent; --hero-pad:0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#090909; --surface:#141414; --surface-2:#1b1b1a; --surface-3:#262523; --border:#2a2826; --border-strong:#3a3631;
  --text:#f2efe9; --text-2:#cfc9bf; --muted:#9a948a; --placeholder:#5c5852;
  --accent:#c7a46a; --gold:#c7a46a; --gold-deep:#9c7b45; --accent-fill:#c7a46a; --accent-ink:#111111; --accent-soft:rgba(199,164,106,.13);
  --gold-line:rgba(199,164,106,.45); --gold-glow:rgba(199,164,106,.22);
  --ok:#4ade80; --danger:#ff6b6b; --danger-soft:rgba(255,107,107,.12); --warn:#fbbf24;
  --warn-text:#f3d27a; --warn-strong:#f8e3a6; --warn-bg:rgba(251,191,36,.10); --warn-line:rgba(251,191,36,.32);

/* Dunkle Bereiche in beiden Farbwelten: Kopfzeile, 3D-Vollbild, 360°-Ansicht, Medienflächen */
.topbar,.v3d,.p360,.xcard-media,.pcard-media,.ud-hero{--text:#f2efe9; --text-2:#d8d2c8; --muted:#a59f95; --border:#2f2c29; --border-strong:#3e3a35;
  --surface:#1a1918; --surface-2:#1a1918; --surface-3:#262523; --bg:#0b0b0b;
  --accent:#c7a46a; --gold:#c7a46a; --accent-fill:#c7a46a; --accent-ink:#111111; --accent-soft:rgba(199,164,106,.15); --gold-line:rgba(199,164,106,.45);
  color-scheme:dark}
.topbar{border-bottom-color:rgba(199,164,106,.16)}
.v3d .v3d-bar,.p360 .p3-bar{background:#121212}
@media (hover:hover){:root:not([data-theme="dark"]) .tap:hover{box-shadow:0 0 0 1px var(--gold-line),var(--shadow)}}
.themesw{display:inline-flex}

.avatar{background:hsl(var(--h,30) 32% 84%);color:hsl(var(--h,30) 45% 28%)}

const STORES = ['clients', 'plans', 'days', 'exercises', 'sessions', 'meta', 'checks'];  // 'photos' liegt separat (groß, wird bei Bedarf geladen)

/* Datenmodell (Kurzfassung)
   client   {id, name, notes, goals, photo, createdAt}
   plan     {id, clientId, name, createdAt}
   day      {id, planId, name, order}
   exercise {id, dayId, name, order, targetSets, sets:[{weight,reps}], note}   ← aktueller Plan
   session  {id, clientId, planId, dayId, dayName, dayIndex, date, startedAt, finishedAt,
             status:'active'|'done', note,
             exercises:[{id, exerciseId, name, planNote, note, target, sets:[{weight,reps,rpe,note,done}]}]}
   → Eine Trainingseinheit speichert eine KOPIE (Name, Werte) aller Übungen.
     Planänderungen verändern die Historie deshalb nie. */

/* ---------------- IndexedDB ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB nicht verfügbar'));
      const r = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
      r.onupgradeneeded = () => {
        const db = r.result;
        for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
        if (!db.objectStoreNames.contains('photos')) { const ps = db.createObjectStore('photos', { keyPath: 'id' }); ps.createIndex('clientId', 'clientId'); ps.createIndex('checkId', 'checkId'); }
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const q = fn(this.db.transaction(store, mode).objectStore(store));
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  getAll(s) { return this.req(s, 'readonly', st => st.getAll()); },
  put(s, o) { return this.req(s, 'readwrite', st => st.put(o)); },
  del(s, id) { return this.req(s, 'readwrite', st => st.delete(id)); },
  replaceAll(data) {
    return new Promise((res, rej) => {
      const names = [...STORES, 'photos'], tx = this.db.transaction(names, 'readwrite');
      for (const s of names) {
        const st = tx.objectStore(s); st.clear();
        (Array.isArray(data[s]) ? data[s] : []).forEach(o => { if (o && o.id != null) st.put(o); });
      }
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
};

/* ---------------- State ---------------- */
const S = {}; STORES.forEach(s => S[s] = new Map());
const UI = { search: '', sort: 'recent', open: {}, metric: 'weight', exName: {}, lastRoute: '' };
const all = s => [...S[s].values()];
function dbError(e) { console.error(e); toast('Speichern fehlgeschlagen: ' + (e && e.message || e)); }
function put(store, obj) { obj.updatedAt = Date.now(); S[store].set(obj.id, obj); return DB.put(store, obj).catch(dbError); }
function del(store, id) { S[store].delete(id); return DB.del(store, id).catch(dbError); }
async function loadAll() { for (const s of STORES) { S[s].clear(); (await DB.getAll(s)).forEach(o => S[s].set(o.id, o)); } }

let saveTimer = null, pendingSession = null;
function saveSessionSoon(sess) { pendingSession = sess; clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 350); }
function flushSave() { clearTimeout(saveTimer); if (pendingSession) { put('sessions', pendingSession); pendingSession = null; } }

/* ---------------- Helpers ---------------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').trim().toLowerCase();
const hasVal = v => v !== null && v !== undefined && v !== '';
const byOrder = (a, b) => a.order - b.order;
function parseNum(v) { v = String(v ?? '').trim().replace(',', '.'); if (v === '') return null; const n = parseFloat(v); return isFinite(n) ? n : null; }
const fmtNum = n => hasVal(n) ? Number(n).toLocaleString('de-DE', { maximumFractionDigits: 2 }) : '';
const fmtIn = n => hasVal(n) ? Number(n).toLocaleString('de-DE', { maximumFractionDigits: 2, useGrouping: false }) : '';
const fmtVol = n => fmtNum(Math.round(n)) + ' kg';
function fmtSet(s) {
  const w = hasVal(s.weight), r = hasVal(s.reps);
  if (w && r) return `${fmtNum(s.weight)} kg × ${fmtNum(s.reps)}`;
  if (w) return `${fmtNum(s.weight)} kg`;
  if (r) return `${fmtNum(s.reps)} Wdh.`;
  return '–';
}
/* Planvorgabe eines Satzes: Wiederholungsbereich (z. B. 10–12) oder „max.“ bei Körpergewicht */
function repsLabel(t, amrap) {
  if (amrap) return 'max.';
  if (!t) return '';
  if (hasVal(t.reps) && hasVal(t.repsMax) && t.repsMax > t.reps) return `${fmtNum(t.reps)}–${fmtNum(t.repsMax)}`;
  return hasVal(t.reps) ? fmtNum(t.reps) : hasVal(t.repsMax) ? fmtNum(t.repsMax) : '';
}
/* Kompakte Planzeile: „4 × 10–12“ oder „10–12 / 8–10 / 6–8 / 8–10“ */
function planSummary(e) {
  const n = e.targetSets || CONFIG.DEFAULT_SETS;
  if (e.amrap) return `${n} × max. Wdh.`;
  const sets = (e.sets || []).slice(0, n);
  if (!sets.some(s => hasVal(s.weight) || hasVal(s.reps) || hasVal(s.repsMax))) return `${n} Sätze`;
  const parts = sets.map(s => fmtTarget(s).replace(' Wdh.', '')), u = e.unit === 's' ? ' Sek.' : '';
  return (new Set(parts).size === 1 ? `${n} × ${parts[0]}` : parts.join(' / ')) + u;
}
function fmtTarget(t, amrap) {
  const r = repsLabel(t, amrap), w = t && hasVal(t.weight);
  if (w && r) return `${fmtNum(t.weight)} kg × ${r}`;
  if (w) return `${fmtNum(t.weight)} kg`;
  return r ? `${r} Wdh.` : '–';
}
const isoOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => isoOf(new Date());
function fmtDate(iso) { if (!iso) return '–'; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }
const fmtDateTs = ts => fmtDate(isoOf(new Date(ts)));
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
function relDays(iso) { const n = daysBetween(iso, today()); return n === 0 ? 'heute' : n === 1 ? 'gestern' : n < 0 ? `in ${-n} Tagen` : `vor ${n} Tagen`; }
const dayLabel = (idx, name) => `Tag ${idx + 1} – ${name || 'Ohne Namen'}`;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }
const go = p => { location.hash = '#' + p; };
function download(name, text, mime) {

const planOf = cid => all('plans').filter(p => p.clientId === cid).sort((a, b) => a.createdAt - b.createdAt)[0] || null;

const sessionVolume = sess => sess.exercises.reduce((t, e) => t + e.sets.filter(isPerformed).reduce((a, s) => a + setVol(s), 0), 0);

  const days = clientDays(cid); if (!days.length) return null;
  const last = lastSession(cid); if (!last) return days[0];
  let i = days.findIndex(d => d.id === last.dayId);
  if (i < 0) i = days.findIndex(d => norm(d.name) === norm(last.dayName));
  return i < 0 ? days[0] : days[(i + 1) % days.length];
}
function lastResult(cid, exerciseId, name, excludeId) {
  const n = norm(name);
  for (const s of sessionsOf(cid, true)) {
    if (s.id === excludeId) continue;
    const e = (exerciseId && s.exercises.find(x => x.exerciseId === exerciseId)) || s.exercises.find(x => norm(x.name) === n);
    if (e) { const sets = e.sets.filter(isPerformed); if (sets.length) return { session: s, sets, name: e.name, note: e.note }; }
  }

}

  const done = sessionsOf(cid, true).filter(s => sessionVolume(s) > 0); if (done.length < 2) return null;
  const last = done[0];
  const prev = done.slice(1).find(s => s.dayId === last.dayId || norm(s.dayName) === norm(last.dayName)); if (!prev) return null;
  const v1 = sessionVolume(last), v0 = sessionVolume(prev);
  return { pct: (v1 - v0) / v0 * 100, last, prev };
}
function exerciseSeries(cid, name) {
  const n = norm(name);
  return sessionsOf(cid, true).slice().reverse().map(s => {
    const e = s.exercises.find(x => norm(x.name) === n); if (!e) return null;
    const sets = e.sets.filter(isPerformed); if (!sets.length) return null;
    let top = null;
    for (const st of sets) if (hasVal(st.weight) && (!top || st.weight > top.weight || (st.weight === top.weight && (st.reps || 0) > (top.reps || 0)))) top = st;
    if (!top) top = sets.reduce((a, b) => ((b.reps || 0) > (a.reps || 0) ? b : a));
    const e1 = Math.max(0, ...sets.map(st => hasVal(st.weight) && st.reps > 0 ? st.weight * (1 + st.reps / 30) : 0));
    return { session: s, date: s.date, top, reps: sets.reduce((a, b) => a + (b.reps || 0), 0), vol: sets.reduce((a, b) => a + setVol(b), 0), e1rm: e1, sets: sets.length };

    if (!e.sets.some(isPerformed)) continue;

const STEP_PRESETS = [1.25, 2.5, 5];

  const k = typeof katFind === 'function' ? katFind(name, catalogId) : null;

}
function progOfPlan(pe) {
  return { step: pe.step > 0 ? pe.step : defaultStep(pe.name, pe.catalogId), auto: !!pe.autoSuggest,
    start: hasVal(pe.startWeight) ? pe.startWeight : null, goal: hasVal(pe.goalWeight) ? pe.goalWeight : null };
}
function progOf(sessEx) {
  const pe = sessEx.exerciseId && S.exercises.get(sessEx.exerciseId);
  if (pe) return progOfPlan(pe);
  if (sessEx.prog) return sessEx.prog;
  return { step: defaultStep(sessEx.name), auto: false, start: null, goal: null };
}
const topWeight = sets => { const ws = sets.filter(s => hasVal(s.weight)).map(s => s.weight); return ws.length ? Math.max(...ws) : null; };
function suggestFor(sessEx, last, prog) {
  if (!prog || !prog.auto || sessEx.amrap) return null;
  const top = last ? topWeight(last.sets) : null;
  if (top == null) return hasVal(prog.start) ? { weight: prog.start, delta: null, kind: 'start', reason: 'Startgewicht laut Plan' } : null;
  if (hasVal(prog.goal) && top >= prog.goal) return { weight: top, delta: 0, kind: 'goal', reason: `Ziel ${fmtNum(prog.goal)} kg erreicht 🎉 – Gewicht halten oder neues Ziel setzen` };
  const n = (sessEx.target && sessEx.target.length) || sessEx.sets.length || 1;
  const atTop = last.sets.filter(s => s.weight === top);
  const withReps = last.sets.filter(s => hasVal(s.reps));
  if (!withReps.length) return { weight: top, delta: 0, kind: 'hold', reason: 'Keine Wiederholungen erfasst – Gewicht halten' };
  const ref = atTop.length && hasVal(atTop[0].reps) ? atTop[0].reps : 0;
  const ok = last.sets.length >= n && last.sets.every((s, i) => {
    if (!hasVal(s.reps)) return false;
    const t = sessEx.target && sessEx.target[i];
    // Sweat4-Regel: Gewicht erst erhöhen, wenn die OBERE Grenze des Bereichs (z. B. 12 bei 10–12) geschafft ist
    const need = t ? (hasVal(t.repsMax) ? t.repsMax : t.reps) : null;
    if (hasVal(need)) return s.reps >= need;
    return s.weight !== top || s.reps >= ref;

  let next = r3(top + prog.step);

  return { weight: next, delta: r3(next - top), kind: 'up', reason: `Letztes Mal alle Sätze mit ${fmtNum(top)} kg geschafft (${last.sets.map(s => fmtNum(s.reps)).join(' / ')} Wdh.)` };
}

  if (!hasVal(goal)) return '';
  const s0 = hasVal(start) ? start : (hasVal(cur) ? Math.min(cur, goal) : 0);
  const span = goal - s0, c = hasVal(cur) ? cur : s0;

  return `<div class="gbar" role="img" aria-label="Ziel ${fmtNum(goal)} kg, aktuell ${fmtNum(c)} kg">

    <div class="gb-cur">Aktuell: <b>${hasVal(cur) ? fmtNum(cur) + ' kg' : '–'}</b>${rest > 0 && hasVal(cur) ? ` · noch ${fmtNum(rest)} kg bis zum Ziel` : hasVal(cur) && rest <= 0 ? ' · Ziel erreicht 🎉' : ''}</div>`;
}

   Übungen mit gleichem Buchstaben (ss: 'A', 'B' …), die direkt aufeinander folgen, bilden einen Supersatz. */
const SS_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
function ssInfo(list, i) {
  const e = list[i], L = e && e.ss; if (!L) return null;
  let a = i, b = i;
  while (a > 0 && list[a - 1].ss === L) a--;
  while (b < list.length - 1 && list[b + 1].ss === L) b++;
  if (a === b) return null; // allein → kein Supersatz
  const size = b - a + 1, circuit = size > 2, pos = i - a + 1;
  return { a, b, size, circuit, pos, label: circuit ? `${pos}/${size}` : L + pos, kind: circuit ? 'Zirkel' : 'Supersatz', letter: L,
    next: list[i < b ? i + 1 : a].name, partners: list.slice(a, b + 1).filter((_, k) => a + k !== i).map(x => x.name), first: i === a };
}

function applyTemplate(cid, tplId) {
  const tpl = SWEAT4_SYSTEM.find(t => t.id === tplId); if (!tpl) return;
  const plan = ensurePlan(cid);
  daysOf(plan.id).forEach(d => { exercisesOf(d.id).forEach(e => del('exercises', e.id)); del('days', d.id); });
  Object.assign(plan, { name: 'SWEAT4 · ' + tpl.title, templateId: tpl.id }); put('plans', plan);
  tpl.days.slice(0, CONFIG.MAX_DAYS).forEach(([dayName, exs], i) => {
    const day = { id: uid(), planId: plan.id, name: dayName, order: i }; put('days', day);
    exs.slice(0, CONFIG.MAX_EXERCISES).forEach((x, j) => {
      const k3 = katFind(x.name);
      put('exercises', { id: uid(), dayId: day.id, name: x.name, order: j, createdAt: Date.now(),
        targetSets: x.sets.length, note: x.note || '', rest: (x.rest ?? tpl.rest) || null, ss: x.ss || null, amrap: !!x.amrap, unit: x.unit || null, catalogId: k3 ? k3.id : null,
        sets: x.sets.map(r => ({ weight: null, reps: r ? r[0] : null, repsMax: r ? r[1] : null })),
        step: null, autoSuggest: !x.amrap && !x.bw, startWeight: null, goalWeight: null });
    });
  });
}

}
function confirmDialog(title, text, { ok = 'OK', danger = false, cancel = 'Abbrechen' } = {}) {

function sparkline(vals, w = 120, h = 28) {
  if (vals.length < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (v - mn) / r * (h - 6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function phFor(e, i, last, sug) {
  let w = null, r = null;
  const t = e.target && e.target[i];
  if (last && last.sets.length) { const s = last.sets[Math.min(i, last.sets.length - 1)]; w = s.weight; r = s.reps; }
  if (t && hasVal(t.weight)) w = t.weight;
  // Aktivierter Progressions-Vorschlag ersetzt den Platzhalter nur, wenn zuletzt einheitlich mit einem Gewicht trainiert wurde
  if (sug && hasVal(sug.weight) && (!last || new Set(last.sets.filter(s => hasVal(s.weight)).map(s => s.weight)).size <= 1)) w = sug.weight;
  if (t && (hasVal(t.repsMax) || hasVal(t.reps))) r = hasVal(t.repsMax) ? t.repsMax : t.reps;
  return { w: hasVal(w) ? w : null, r: hasVal(r) ? r : null };
}
const exComplete = e => e.sets.length > 0 && e.sets.every(s => s.done);
const exSummary = e => e.sets.filter(s => s.done).map(x => e.unit === 's' ? fmtSet(x).replace('Wdh.', 'Sek.') : fmtSet(x)).join(' · ');

    const goalHtml = hasVal(pg.goal) ? `<div class="goal-box">${goalBar(pg.start, pg.goal, last ? topWeight(last.sets) : null)}</div>` : '';
    const si = ssInfo(sess.exercises, ei);
    const tg = e.amrap ? e.sets.map(() => 'max.') : (e.target || []).map(t => repsLabel(t)).filter(Boolean), unitL = e.unit === 's' ? 'Sek.' : 'Wdh.';
    const restHtml = e.rest && !si ? `<div class="muted" style="font-size:13px;margin-top:6px">⏱ ${e.rest % 60 ? e.rest + ' Sek.' : e.rest / 60 + ' Min.'} Pause zwischen den Sätzen</div>` : '';

        ${restHtml}${si ? `<div class="muted" style="font-size:13px;margin-top:6px">${si.circuit ? `🔁 Zirkel – Station ${si.pos} von ${si.size}. Danach: <b>${esc(si.next)}</b>. Zwischen den Stationen nur 30 Sek. Pause.` : `🔁 Supersatz ${si.label}: im Wechsel mit <b>${si.partners.map(esc).join(', ')}</b> – Satz hier, dann direkt rüber, danach kurze Pause.`}</div>` : ''}</div>` : '';
    return `<div class="ex-card ${open.has(ei) ? 'open' : ''} ${exComplete(e) ? 'complete' : ''} ${si ? 'is-ss' : ''}" id="ex-${ei}">

        <div id="sets-${ei}">${e.sets.map((_, si) => setRowHtml(e, ei, si, last, sug)).join('')}</div>
        <div class="ex-actions">
          <button class="btn btn-sm btn-ghost" data-action="add-set" data-ei="${ei}" ${e.sets.length >= CONFIG.MAX_SETS ? 'disabled' : ''}>${ic('plus', 16)} Satz</button>

          ${(k3 => k3 ? `<button class="btn btn-sm btn-ghost" data-action="open3d" data-id="${k3.id}" data-fig="${figureForClient(c) || ''}">${ic('cube', 16)} Technik & ${videoMode() ? 'Video' : '3D'}</button>` : '')(katForSessionEx(e))}
          ${ei < sess.exercises.length - 1 ? `<button class="btn btn-sm btn-text" data-action="next-ex" data-ei="${ei}">Nächste Übung ${ic('down', 16)}</button>` : ''}

  const pct = total ? Math.round(doneN / total * 100) : 0;
  return topbar({

    extra: `<div class="tb-extra"><div class="tbar"><span id="tbar" style="width:${pct}%"></span></div><span class="tcount" id="tcount">${doneN}/${total} Sätze</span></div>`
  }) + `<main class="wrap view">
    <label class="row" style="margin-bottom:12px"><span class="muted" style="font-size:14px">Datum</span><input type="date" class="input" data-tf="date" value="${esc(sess.date)}" style="width:auto;padding:8px 12px;font-size:16px"></label>
    ${cards || '<div class="card empty">Dieser Trainingstag hat keine Übungen.</div>'}
    <button class="btn btn-ghost btn-block" data-action="add-adhoc">${ic('plus')} Übung nur für dieses Training hinzufügen</button>
    <section class="section">
      <div class="section-h"><h2>Trainingsnotiz</h2></div>
      <textarea class="ex-note" data-tf="snote-session" rows="3" placeholder="z. B. Heute bei Kniebeugen etwas weniger Gewicht wegen Müdigkeit.">${esc(sess.note)}</textarea>
    </section>

      ${editing ? `<a class="btn btn-primary btn-big" href="#/session/${sess.id}">${ic('check', 22)} Fertig</a>`

                   <button class="btn btn-text btn-block" style="margin-top:8px" data-action="discard">Training verwerfen</button>`}

let chartN = 0;
function niceTick(raw) {
  if (!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 1.25, 2, 2.5, 5, 10]) if (m * p >= raw) return r3(m * p) || m * p;
  return 10 * p;
}
function lineChart(points, unit = '') {
  if (!points.length) return '<div class="empty">Noch keine Daten.</div>';
  const W = Math.max(300, Math.min(748, (document.getElementById('app').clientWidth || 360) - 66)), H = 220, pl = 58, pr = 18, pt = 18, pb = 30;
  const ys = points.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mn === mx) { mn -= Math.max(1, Math.abs(mn) * 0.1); mx += Math.max(1, Math.abs(mx) * 0.1); }
  const pad = (mx - mn) * 0.12; mn = Math.max(mn - pad, Math.min(...ys) >= 0 ? 0 : -Infinity); mx += pad;
  // „Schöne“ Achsenschritte inkl. 1,25 / 2,5 kg – Dezimalwerte werden exakt beschriftet
  const tick = niceTick((mx - mn) / 3);
  mn = r3(Math.floor(mn / tick) * tick); mx = r3(Math.ceil(mx / tick) * tick); if (mx <= mn) mx = r3(mn + tick);
  const ticks = []; for (let v = mn; v <= mx + tick / 1e6 && ticks.length < 9; v = r3(v + tick)) ticks.push(v);
  const X = i => points.length === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (points.length - 1);
  const Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  const id = 'g' + (++chartN);
  let grid = '';
  ticks.forEach((v, k) => { const y = Y(v); grid += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="${k ? '3 4' : ''}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${fmtNum(v)}</text>`; });
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = points.length > 1 ? `<path d="${d}L${X(points.length - 1)},${H - pb}L${X(0)},${H - pb}Z" fill="url(#${id})"/>` : '';
  const labelIdx = points.length <= 4 ? points.map((_, i) => i) : [0, Math.floor((points.length - 1) / 2), points.length - 1];
  const xl = labelIdx.map(i => `<text x="${X(i)}" y="${H - 8}" text-anchor="${points.length > 1 && i === 0 ? 'start' : i === points.length - 1 && points.length > 1 ? 'end' : 'middle'}">${esc(points[i].label)}</text>`).join('');
  const li = points.length - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#be9b5c" stop-opacity=".28"/><stop offset="1" stop-color="#be9b5c" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area}<path class="ln" d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i === li ? 5 : 3.5}" fill="${i === li ? 'var(--accent)' : 'var(--bg)'}" stroke="var(--accent)" stroke-width="2"><title>${esc(p.label)}: ${fmtNum(p.y)} ${unit}</title></circle>`).join('')}
    <text class="vl" x="${Math.min(X(li), W - pr)}" y="${Math.max(12, Y(points[li].y) - 12)}" text-anchor="${points.length > 1 ? 'end' : 'middle'}">${fmtNum(points[li].y)} ${unit}</text>
    ${xl}</svg>`;
}

const METRICS = {
  weight: { label: 'Gewicht', title: 'Top-Gewicht pro Training', unit: 'kg', get: p => hasVal(p.top.weight) ? p.top.weight : null },
  reps: { label: 'Wiederholungen', title: 'Wiederholungen gesamt pro Training', unit: 'Wdh.', get: p => p.reps },
  volume: { label: 'Volumen', title: 'Volumen (Gewicht × Wdh.) pro Training', unit: 'kg', get: p => p.vol || null },
  e1rm: { label: '1RM (geschätzt)', title: 'Geschätztes Maximalgewicht (Epley)', unit: 'kg', get: p => p.e1rm ? Math.round(p.e1rm * 100) / 100 : null },
};
function viewProgress(c) {
  const done = sessionsOf(c.id, true), names = exerciseNames(c.id);
  let sel = UI.exName[c.id]; if (!sel || !names.some(n => norm(n.name) === norm(sel))) sel = names[0]?.name;
  const M = METRICS[UI.metric];
  const series = sel ? exerciseSeries(c.id, sel) : [];
  const pts = series.map(p => ({ label: fmtDate(p.date).slice(0, 6), y: M.get(p) })).filter(p => p.y != null);
  const volPts = done.slice().reverse().map(s => ({ label: fmtDate(s.date).slice(0, 6), y: sessionVolume(s) })).filter(p => p.y > 0);
  const trend = volumeTrend(c.id), totalVol = done.reduce((t, s) => t + sessionVolume(s), 0);
  const prs = names.map(n => {
    const ser = exerciseSeries(c.id, n.name); let bw = null, be = null;
    for (const p of ser) { if (hasVal(p.top.weight) && (!bw || p.top.weight > bw.top.weight)) bw = p; if (p.e1rm && (!be || p.e1rm > be.e1rm)) be = p; }
    return { name: n.name, bw, be, last: ser[ser.length - 1] };
  });
  return topbar({ back: '/client/' + c.id, title: 'Fortschritt', sub: esc(c.name) }) +
  `<main class="wrap view">
    ${!done.length ? '<div class="card empty">Noch keine abgeschlossenen Trainings. Sobald Trainings dokumentiert sind, erscheinen hier Diagramme.</div>' : `
    <div class="stats four">
      <div class="stat"><div class="stat-l">Trainings</div><div class="stat-v">${done.length}</div><div class="stat-s">seit ${fmtDate(done[done.length - 1].date)}</div></div>
      <div class="stat"><div class="stat-l">Letzte 30 Tage</div><div class="stat-v">${done.filter(s => daysBetween(s.date, today()) <= 30).length}</div><div class="stat-s">Trainings</div></div>
      <div class="stat"><div class="stat-l">Gesamtvolumen</div><div class="stat-v">${fmtNum(Math.round(totalVol / 1000 * 10) / 10)} t</div><div class="stat-s">bewegtes Gewicht</div></div>
      <div class="stat"><div class="stat-l">Volumen-Trend</div><div class="stat-v">${trend ? `<span class="${trend.pct >= 0 ? 'up' : 'down'}">${trend.pct >= 0 ? '+' : ''}${fmtNum(Math.round(trend.pct))} %</span>` : '–'}</div><div class="stat-s">vs. letztes Mal</div></div>
    </div>

    <section class="section">
      <div class="section-h"><h2>Entwicklung einer Übung</h2></div>
      <div class="card">
        <select class="input" id="ex-select" data-cid="${c.id}" aria-label="Übung wählen">${names.map(n => `<option ${norm(n.name) === norm(sel) ? 'selected' : ''}>${esc(n.name)}</option>`).join('')}</select>
        <div class="seg" style="margin:12px 0 6px">${Object.entries(METRICS).map(([k, m]) => `<button class="${UI.metric === k ? 'on' : ''}" data-action="metric" data-v="${k}">${m.label}</button>`).join('')}</div>
${(pe => { if (!pe) return ''; const pg = progOfPlan(pe); if (!hasVal(pg.goal) && !pg.auto) return '';
          const cur = series.length && hasVal(series[series.length - 1].top.weight) ? series[series.length - 1].top.weight : null;
          return `<div class="goal-box" style="margin:10px 0 12px">${hasVal(pg.goal) ? `<div class="gb-h">Trainingsziel</div>${goalBar(pg.start, pg.goal, cur)}` : ''}<div class="gb-cur" style="margin-top:${hasVal(pg.goal) ? 4 : 0}px">Steigerung: ${fmtNum(pg.step)} kg${pg.auto ? ' · automatischer Vorschlag aktiv' : ''}</div></div>`; })(sel ? planExByName(c.id, sel) : null)}
        <div class="muted" style="font-size:13px;margin-bottom:6px">${M.title}</div>
        ${lineChart(pts, M.unit)}
        ${series.length ? `<table class="table" style="margin-top:10px"><thead><tr><th>Datum</th><th>Bester Satz</th><th class="r">Sätze</th><th class="r">Volumen</th></tr></thead><tbody>
          ${series.slice().reverse().map((p, i, arr) => { const prev = arr[i + 1]; const tw = p.top.weight, pw = prev && prev.top.weight;
            const arrow = prev && hasVal(tw) && hasVal(pw) ? (tw > pw ? ' <span class="up">▲</span>' : tw < pw ? ' <span class="down">▼</span>' : '') : '';
            return `<tr><td><a href="#/session/${p.session.id}">${fmtDate(p.date)}</a></td><td>${fmtSet(p.top)}${arrow}</td><td class="r">${p.sets}</td><td class="r">${fmtVol(p.vol)}</td></tr>`; }).join('')}
        </tbody></table>` : ''}
      </div>
    </section>

    <section class="section">
      <div class="section-h"><h2>Trainingsvolumen pro Training</h2></div>
      <div class="card">${lineChart(volPts, 'kg')}</div>
    </section>

    <section class="section">
      <div class="section-h"><h2>Persönliche Bestleistungen</h2></div>
      <div class="card" style="overflow-x:auto"><table class="table"><thead><tr><th>Übung</th><th>Höchstes Gewicht</th><th class="r">1RM geschätzt</th></tr></thead><tbody>
        ${prs.map(p => `<tr><td style="font-weight:600">${esc(p.name)}</td><td>${p.bw ? `${fmtSet(p.bw.top)}<div class="muted" style="font-size:12px">${fmtDate(p.bw.date)}</div>` : '–'}</td><td class="r">${p.be ? fmtNum(Math.round(p.be.e1rm * 10) / 10) + ' kg' : '–'}</td></tr>`).join('')}
      </tbody></table></div>
    </section>`}
  </main>`;
}

    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(img.width, img.height), cv = document.createElement('canvas'), out = Math.min(max, s);
      cv.width = cv.height = out; cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, out, out);
      res(cv.toDataURL('image/jpeg', 0.85)); }; img.onerror = () => rej(new Error('Bild konnte nicht gelesen werden')); img.src = r.result; };
    r.onerror = () => rej(r.error); r.readAsDataURL(file);
  });
}
