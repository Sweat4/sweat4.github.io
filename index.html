/* ---------------- Pausen-Timer ----------------
   Startet nach jedem abgehakten Satz, wenn die Übung eine Pause hat (z. B. 2 Min. beim Muskelaufbau,
   30 Sek. im Athletikzirkel). Rechnet mit der Uhrzeit, läuft also auch weiter, wenn das Handy kurz gesperrt ist. */
const RT = { end: 0, total: 0, iv: 0, ac: null, label: '' };
const mmss = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
function beep() {
  try {
    const ac = RT.ac; if (!ac) return;
    [0, 0.28].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.22);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.25); });
  } catch (e) {}
}
function restStart(sec, label) {
  if (!(sec > 0)) return;
  try { RT.ac = RT.ac || new (window.AudioContext || window.webkitAudioContext)(); if (RT.ac.state === 'suspended') RT.ac.resume(); } catch (e) {} // beim Antippen freischalten (iOS)
  RT.total = sec; RT.end = Date.now() + sec * 1000; RT.label = label || 'Pause';
  const el = document.getElementById('rest-timer'); el.classList.remove('done'); el.classList.add('show'); document.body.classList.add('resting');
  clearInterval(RT.iv); RT.iv = setInterval(restTick, 250); restTick();
}
function restTick() {
  const el = document.getElementById('rest-timer');
  if (!curSession()) return restStop();
  const left = Math.max(0, Math.ceil((RT.end - Date.now()) / 1000));
  if (left <= 0 && !el.classList.contains('done')) {
    el.classList.add('done'); clearInterval(RT.iv); RT.iv = 0;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]); beep();
    setTimeout(() => { if (el.classList.contains('done')) restStop(); }, 4000);
  }
  el.innerHTML = `<div class="rt-row"><div class="rt-time">${left > 0 ? mmss(left) : 'Los!'}</div>
    <div class="grow"></div>
    ${left > 0 ? `<button class="btn btn-sm btn-ghost" data-action="rest-add">+30 s</button>` : ''}<button class="btn btn-sm btn-ghost" data-action="rest-stop">${left > 0 ? 'Überspringen' : 'OK'}</button></div>
    <div class="rt-bar" style="width:${RT.total ? Math.max(0, left / RT.total * 100) : 0}%"></div>`;
}

  'toggle-ex': el => { const sess = curSession(), ei = +el.dataset.ei; (UI.open[sess.id] && UI.open[sess.id].has(ei)) ? closeEx(sess, ei) : openEx(sess, ei); },
  'next-ex': el => { const sess = curSession(), ei = +el.dataset.ei; closeEx(sess, ei); openEx(sess, ei + 1, true); },
  check: el => {
    const sess = curSession(), ei = +el.dataset.ei, si = +el.dataset.si, ex = sess.exercises[ei], st = ex.sets[si];
    const row = document.getElementById(`sr-${ei}-${si}`);
    if (!st.done) {
      const w = row.querySelector('[data-tf=weight]'), r = row.querySelector('[data-tf=reps]');
      if (!hasVal(st.weight) && w.dataset.ph !== '') { st.weight = parseNum(w.dataset.ph); w.value = fmtIn(st.weight); }
      if (!hasVal(st.reps) && r.dataset.ph !== '') { st.reps = parseNum(r.dataset.ph); r.value = fmtIn(st.reps); }
      const pv = si > 0 ? ex.sets[si - 1] : null; // Fallback: Werte des vorherigen Satzes
      if (pv && !hasVal(st.weight) && hasVal(pv.weight)) { st.weight = pv.weight; w.value = fmtIn(st.weight); }
      if (pv && !hasVal(st.reps) && hasVal(pv.reps)) { st.reps = pv.reps; r.value = fmtIn(st.reps); }
      st.done = true; if (navigator.vibrate) navigator.vibrate(12);
      const isLast = sess.exercises.every(x => x.sets.every(y => y.done));
      // Supersatz: Pause erst, wenn alle Partner diesen Satz haben · Zirkel: kurze Pause nach jeder Station
      const sg = ssInfo(sess.exercises, ei);
      const roundDone = !sg || sg.circuit || sess.exercises.slice(sg.a, sg.b + 1).every(x => !x.sets[si] || x.sets[si].done);
      if (ex.rest && !isLast && roundDone) restStart(ex.rest, ex.rest <= 45 ? 'Kurze Pause' : 'Satzpause');
    } else st.done = false;
    row.classList.toggle('done', st.done);
    refreshExHead(sess, ei); refreshTrainHead(sess); saveSessionSoon(sess); flushSave();
    // Supersatz: nach dem Satz direkt zur Partnerübung (gleiche Satznummer), danach zurück
    const ssi = st.done ? ssInfo(sess.exercises, ei) : null;
    if (ssi) {
      const grp = []; for (let k = ssi.a; k <= ssi.b; k++) grp.push(k);
      const after = grp.slice(grp.indexOf(ei) + 1).concat(grp.slice(0, grp.indexOf(ei)));
      const nx = after.find(k => sess.exercises[k].sets.some(x => !x.done));
      if (nx != null) { setTimeout(() => { closeEx(sess, ei); openEx(sess, nx, true); }, 350); return; }
    }
    if (st.done && exComplete(ex)) {
      const nx = sess.exercises.findIndex((x, i) => i > ei && !exComplete(x));
      setTimeout(() => { closeEx(sess, ei); if (nx >= 0) openEx(sess, nx, true); }, 350);
    }
  },
  'set-more': el => { const x = document.getElementById(`sx-${el.dataset.ei}-${el.dataset.si}`); x.classList.toggle('show'); if (x.classList.contains('show')) x.querySelector('input').focus(); },
  'add-set': el => { const sess = curSession(), e = sess.exercises[+el.dataset.ei]; if (e.sets.length >= CONFIG.MAX_SETS) return; e.sets.push(blankSet()); saveSessionSoon(sess); rerender(); },

    while (e.sets.length < Math.min(CONFIG.MAX_SETS, last.sets.length)) e.sets.push(blankSet());
    e.sets.forEach((s, i) => { const l = last.sets[i]; if (!l || s.done) return; if (!hasVal(s.weight)) s.weight = l.weight; if (!hasVal(s.reps)) s.reps = l.reps; });
    saveSessionSoon(sess); rerender(); toast('Werte übernommen – jetzt anpassen & abhaken');
  },
  'sug-apply': el => {
    const sess = curSession(), e = sess.exercises[+el.dataset.ei], w = parseNum(el.dataset.w); if (w == null) return;
    let n = 0; e.sets.forEach(s => { if (!s.done) { s.weight = w; n++; } });
    if (!n) return toast('Alle Sätze sind bereits abgehakt');
    saveSessionSoon(sess); rerender(); toast(`${fmtNum(w)} kg eingetragen – jederzeit änderbar`);
  },
  'add-adhoc': async () => {
    const sess = curSession(); const name = await promptDialog('Übung hinzufügen', { label: 'Name der Übung (nur für dieses Training)', placeholder: 'z. B. Face Pulls', ok: 'Hinzufügen' });
    if (!name || !name.trim()) return;
    sess.exercises.push({ id: uid(), exerciseId: null, name: name.trim(), planNote: '', note: '', target: [], sets: Array.from({ length: CONFIG.DEFAULT_SETS }, blankSet) });
    (UI.open[sess.id] || (UI.open[sess.id] = new Set())).add(sess.exercises.length - 1);
    saveSessionSoon(sess); rerender(); openEx(sess, sess.exercises.length - 1, true);
  },
  finish: async () => {
    const sess = curSession();
    if (!sessionSets(sess) && !await confirmDialog('Keine Sätze eingetragen', 'Es wurden noch keine Werte eingetragen. Training trotzdem speichern?', { ok: 'Trotzdem speichern' })) return;
    sess.status = 'done'; sess.finishedAt = Date.now(); pendingSession = sess; flushSave();
    toast('Training gespeichert ✓'); go('/client/' + sess.clientId);
  },
  discard: async () => {
    const sess = curSession();

  },

    const s = S.sessions.get(el.dataset.id);
    if (!await confirmDialog('Training löschen?', `Das Training vom ${fmtDate(s.date)} (${esc(sessLabel(s))}) wird endgültig aus der Historie gelöscht.`, { ok: 'Löschen', danger: true })) return;
    del('sessions', s.id); toast('Training gelöscht'); go('/client/' + s.clientId + '/history');

  metric: el => { UI.metric = el.dataset.v; render(); },
  backup: () => doBackup(),
  import: () => document.getElementById('import-file').click(),
  csv: el => csvExport(el.dataset.cid),

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]'); if (!el) return;

document.addEventListener('submit', async ev => {
  const f = ev.target; ev.preventDefault();
  const fd = new FormData(f);
  if (f.dataset.form === 'prompt') return closeModal(fd.get('v') || '');
  if (f.dataset.form === 'client') {
    const name = String(fd.get('name') || '').trim(); if (!name) return;
    const isNew = !f.dataset.id;
    if (isNew && fd.get('consent') !== 'on') { toast('Bitte zuerst die Einwilligung bestätigen'); f.querySelector('[name=consent]').closest('.toggle').classList.add('need'); return; }
    const c = isNew ? { id: uid(), createdAt: Date.now() } : S.clients.get(f.dataset.id);
    Object.assign(c, { name, goals: String(fd.get('goals') || '').trim(), notes: String(fd.get('notes') || '').trim(), photo: UI.photoDraft || null }, clientExtraValues(fd));
    c.consentAt = fd.get('consent') === 'on' ? (c.consentAt || Date.now()) : null;
    put('clients', c); if (isNew) { ensurePlan(c.id); requestPersist(); }
    closeModal(null); toast(isNew ? 'Kunde angelegt' : 'Gespeichert');
    if (isNew) go('/client/' + c.id); else render();
  }
  if (f.dataset.form === 'exercise') {
    const name = String(fd.get('name') || '').trim(); if (!name) return;
    const n = +fd.get('targetSets') || CONFIG.DEFAULT_SETS, did = f.dataset.did;
    const sets = Array.from({ length: n }, (_, i) => ({ weight: parseNum(fd.get('w' + i)), reps: parseNum(fd.get('r' + i)), repsMax: parseNum(fd.get('rm' + i)) }));
    let e = f.dataset.id ? S.exercises.get(f.dataset.id) : null;
    if (!e) { if (exercisesOf(did).length >= CONFIG.MAX_EXERCISES) return toast('Maximum erreicht'); e = { id: uid(), dayId: did, order: exercisesOf(did).length, createdAt: Date.now() }; }
    Object.assign(e, { name, targetSets: n, sets, note: String(fd.get('note') || '').trim(), ss: String(fd.get('ss') || '') || null, amrap: fd.get('amrap') === 'on', rest: (r => r > 0 && r <= 600 ? Math.round(r) : null)(parseNum(fd.get('rest'))) });
    const k3 = katFind(name); e.catalogId = k3 ? k3.id : null;
    // Progression – Werte exakt speichern (keine Rundung)
    const ss = fd.get('stepSel');
    let step = ss === 'custom' ? parseNum(fd.get('stepCustom')) : parseNum(ss);
    if (!(step > 0) || step > 100) step = null;
    if (!f.dataset.stepTouched && !(e.step > 0)) step = null; // unverändert → Standard je nach Übung (Kurzhantel 1,25 kg, sonst 2,5 kg)
    const sw = parseNum(fd.get('startWeight')), gw = parseNum(fd.get('goalWeight'));
    Object.assign(e, { step, autoSuggest: fd.get('autoSuggest') === 'on', startWeight: sw, goalWeight: gw });
    put('exercises', e); closeModal(null); render();
  }
});

  }
  const f = t.dataset.tf; if (!f) return;
  const sess = curSession(); if (!sess) return;
  if (f === 'date') { if (t.value) { sess.date = t.value; saveSessionSoon(sess); } return; }
  if (f === 'snote-session') { sess.note = t.value; return saveSessionSoon(sess); }
  const e = sess.exercises[+t.dataset.ei];
  if (f === 'exnote') { e.note = t.value; return saveSessionSoon(sess); }
  const s = e.sets[+t.dataset.si];

  else if (f === 'rpe') s.rpe = t.value.trim();

/* =====================================================================
   Übungskatalog & 3D-Ausführung (Erweiterung)
   - Katalogdaten: uebungen-katalog.js (window.SW_KATALOG)
   - 3D-Engine: uebungen3d.js + three.min.js – werden erst beim Öffnen geladen
   - Verknüpfung: Plan-Übung über catalogId bzw. Name/Alias
   ===================================================================== */
const KAT = () => window.SW_KATALOG || [];
const MUSKEL = id => (window.SW_MUSKELN || {})[id] || id;
const normK = s => norm(s).replace(/[–—-]/g, ' ').replace(/[^a-z0-9äöüß ]/g, '').replace(/\s+/g, ' ').trim();
let _katIdx = null;
function katIndex() {
  if (_katIdx) return _katIdx;
  const m = new Map();
  for (const e of KAT()) { m.set(normK(e.n), e); (e.alias || []).forEach(a => { const k = normK(a); if (!m.has(k)) m.set(k, e); }); }
  return (_katIdx = m);
}
function katFind(name, id) {
  if (id) { const e = KAT().find(x => x.id === id); if (e) return e; }
  return name ? katIndex().get(normK(name)) || null : null;
}
function katForSessionEx(e) { const pe = e.exerciseId && S.exercises.get(e.exerciseId); return katFind(e.name, pe && pe.catalogId); }

function infoHtml(e) {
  const li = a => `<ul class="ul">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  return `<table class="table"><tbody>
      <tr><td class="muted">Muskelgruppe</td><td>${esc(e.g)}</td></tr><tr><td class="muted">Zielmuskel</td><td>${esc(e.sub)}</td></tr><tr><td class="muted">Equipment</td><td>${esc(e.eq)}</td></tr></tbody></table>
    <h3>Ausgangsposition</h3><div>${esc(e.start)}</div>
    <h3>Ausführung</h3><div>${esc(e.exec)}</div>
    <h3>Bewegungsrichtung</h3><div>${esc(e.dir)}</div>
    <h3>Wichtige Hinweise</h3>${li(e.tips)}
    <h3>Häufige Fehler</h3>${li(e.errs)}
    <h3>Beanspruchte Muskulatur</h3><div class="mchips">${e.prim.map(m => `<span class="mchip p">${esc(MUSKEL(m))}</span>`).join('')}${e.sec.map(m => `<span class="mchip">${esc(MUSKEL(m))}</span>`).join('')}</div>
    <div class="muted" style="font-size:12px;margin-top:6px">Gold = primär, grau = sekundär</div>`;
}
/* =====================================================================
   REDESIGN – Übungskatalog, Detailansicht, Programm-Cards
   Komponenten (als Funktionen, die HTML liefern):
     ExerciseCard · ExercisePreview · ExerciseDetailView · WorkoutPlanCard ·
     TrainingDayCard · FilterChip · SectionHeader · LoadingState · EmptyState
   Vorschaubilder sind echte Standbilder aus der 3D-Engine (uebungen3d.js):
   einmal erzeugt, im Cache-Speicher des Browsers abgelegt, danach sofort da.
   ===================================================================== */
/* ---------- Trainingsfigur: zentrale Zuordnung ----------
   Eine Übung existiert nur einmal im Katalog. Welche Figur sie zeigt, entscheidet allein diese Konfiguration. */
const FIGURE_CONFIG = {
  byTemplate: { 'w-def-3': 'w', 'w-mass-3': 'w', 'm-def-3': 'm', 'm-mass-3': 'm' }, // SWEAT4-Programm → Figur
  bySex: { w: 'w', m: 'm' },                                                       // Geschlecht im Kundenprofil → Figur
  fallback: 'm',
};
const FIG_LABEL = { w: 'Frau', m: 'Mann' };
function figurePref() { try { const v = localStorage.getItem('sw-figure'); return v === 'm' || v === 'w' ? v : null; } catch (e) { return null; } }
function setFigurePref(v) { try { localStorage.setItem('sw-figure', v); } catch (e) {} }
function figureForClient(c) {
  if (!c) return null;
  const plan = planOf(c.id), t = plan && FIGURE_CONFIG.byTemplate[plan.templateId];
  return t || FIGURE_CONFIG.bySex[c.sex] || null;
}
function figureDefault() { // eigene Auswahl > eigener Kundenzugang > Standard
  const p = figurePref(); if (p) return p;
  if (isClientMode()) { const f = figureForClient(S.clients.get(roleInfo().clientId)); if (f) return f; }
  return FIGURE_CONFIG.fallback;
}
const curFig = () => UI.fig || figureDefault();
const FigureSwitch = fig => `<div class="figsw" role="group" aria-label="Trainingsfigur">${['w', 'm'].map(v => `<button class="${v === fig ? 'on' : ''}" data-action="fig-set" data-v="${v}" aria-pressed="${v === fig}">${FIG_LABEL[v]}</button>`).join('')}</div>`;
/* ---------- Video-Service: echte Übungsvideos ----------
   Zentrale Stelle für alle Videoquellen. Reihenfolge: eigene Videos (SW_MEDIA) → Video-Server (MuscleWiki).
   Ist kein Video-Server eingetragen (SW_VIDEO.endpoint leer), bleibt die bisherige 3D-Darstellung aktiv. */
const videoMode = () => !!((window.SW_VIDEO || {}).endpoint);
const VIDEO = { cache: new Map() };
async function videoFor(id, fig) {
  const own = mediaFor(id, fig); if (own) return { src: own.src, poster: own.poster, source: 'SWEAT4' };
  if (!videoMode()) return null;
  const key = id + '|' + fig, hit = VIDEO.cache.get(key);
  if (hit && hit.until > Date.now()) return hit.v;
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(SW_VIDEO.endpoint.replace(/\/$/, '') + '/video?id=' + encodeURIComponent(id) + '&fig=' + fig, { signal: ctl.signal });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Server antwortet nicht');
    const v = d.none ? null : { src: d.src, source: d.source || 'MuscleWiki', angle: d.angle, female: d.female };
    VIDEO.cache.set(key, { v, until: Date.now() + (v ? 9 : 30) * 60000 }); // Token gilt 15 Min.
    return v;
  } finally { clearTimeout(t); }
}
function mediaFor(id, fig) { const m = (window.SW_MEDIA || {})[id]; return m ? (m[fig] || m.any || null) : null; }

const REDUCED_MOTION = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Equipment-Kategorien (aus dem freien Text im Katalog abgeleitet) ---------- */
const EQ_CATS = [
  ['Langhantel', /langhantel|sz-stange|t-bar/i],
  ['Kurzhantel', /kurzhantel/i],
  ['Kabelzug', /kabel/i],
  ['Maschine', /maschine|multipresse|presse|latzug|hyperextension|hackenschmidt/i],
  ['Körpergewicht', /körpergewicht|matte|barren|dip|klimmzug|plyo/i],
];
const eqCats = e => { const c = EQ_CATS.filter(([, re]) => re.test(e.eq)).map(([n]) => n); return c.length ? c : ['Sonstiges']; };
const eqShort = e => String(e.eq || '').split(',')[0].replace(/\s*\(.*?\)\s*/g, ' ').trim();

/* ---------- Vorschaubilder ---------- */
const THUMB = { mem: new Map(), queue: [], queued: new Set(), busy: false, viewer: null, io: null, failed: false };
const THUMB_CACHE = 'sweat4-thumbs-v4';
const thumbKey = key => new URL('thumb/' + key.replace('|', '-') + '.jpg', location.href).href;
const tkey = (id, fig) => id + '|' + (fig || 'm');
const thumbSel = key => { const [id, fig] = key.split('|'); return `[data-thumb="${id}"][data-fig="${fig}"]`; };
async function thumbFromCache(id) {
  try { if (!('caches' in window)) return null; const r = await (await caches.open(THUMB_CACHE)).match(thumbKey(id)); return r ? URL.createObjectURL(await r.blob()) : null; } catch (e) { return null; }
}
function thumbToCache(id, blob) { try { if ('caches' in window) caches.open(THUMB_CACHE).then(c => c.put(thumbKey(id), new Response(blob, { headers: { 'Content-Type': 'image/jpeg' } }))).catch(() => {}); } catch (e) {} }
function dataUrlBlob(u) { const [h, b] = u.split(','), bin = atob(b), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: h.slice(5, h.indexOf(';')) }); }
function paintThumb(id) {
  const url = THUMB.mem.get(id); if (!url) return;
  document.querySelectorAll(thumbSel(id)).forEach(el => {
    el.classList.remove('is-loading');
    if (el.querySelector('img.thumb-img')) return;
    const img = new Image(); img.className = 'thumb-img'; img.alt = ''; img.decoding = 'async';
    img.onload = () => img.classList.add('in'); img.src = url; el.prepend(img);
  });
}
function thumbFail() { THUMB.failed = true; document.querySelectorAll('[data-thumb].is-loading').forEach(el => el.classList.remove('is-loading')); }
async function thumbWorker() {
  if (THUMB.busy || THUMB.failed) return; THUMB.busy = true;
  try {
    if (!webglOk()) return thumbFail();
    await load3D();
    if (!THUMB.viewer) {
      const h = document.createElement('div'); h.setAttribute('aria-hidden', 'true');
      h.style.cssText = 'position:fixed;left:-10000px;top:0;width:300px;height:300px;pointer-events:none';
      document.body.appendChild(h);
      THUMB.viewer = new SW3D.Viewer(h); // position:fixed → der Viewer rendert nur, wenn wir ihn darum bitten
      THUMB.viewer.playing = false; THUMB.viewer.loop = false;
    }
    const v = THUMB.viewer;
    while (THUMB.queue.length) {
      const id = THUMB.queue.shift(); THUMB.queued.delete(id);
      if (THUMB.mem.has(id)) { paintThumb(id); continue; }
      const [exId, fig] = id.split('|'), e = KAT().find(x => x.id === exId); if (!e) continue;
      try {
        v.setFigure(fig); v.load({ ...e, primary: e.prim, secondary: e.sec }); v.playing = false; v.setMuscles(true);
        if (v.tpl.custom) v.showAt(0, .9); else v.showAt(.62); // Standbild nahe der Endposition
        const blob = dataUrlBlob(v.renderer.domElement.toDataURL('image/jpeg', .82));
        THUMB.mem.set(id, URL.createObjectURL(blob)); thumbToCache(id, blob); paintThumb(id);
      } catch (err) { console.warn('Vorschau', id, err); document.querySelectorAll(thumbSel(id)).forEach(el => el.classList.remove('is-loading')); }
      await new Promise(r => setTimeout(r, 0)); // UI bleibt bedienbar
    }
  } catch (err) { console.warn(err); thumbFail(); }
  finally { THUMB.busy = false; }
}
async function wantThumb(id) {
  if (THUMB.mem.has(id)) return paintThumb(id);
  if (THUMB.failed || THUMB.queued.has(id)) return;
  THUMB.queued.add(id);
  const cached = await thumbFromCache(id);
  if (cached) { THUMB.queued.delete(id); THUMB.mem.set(id, cached); return paintThumb(id); }
  THUMB.queue.push(id); thumbWorker();
}
function hydrateThumbs(root = document) {
  const els = [...root.querySelectorAll('[data-thumb]')]; if (!els.length) return;
  if (THUMB.failed) return thumbFail();
  const K = el => tkey(el.dataset.thumb, el.dataset.fig);
  els.forEach(el => { if (THUMB.mem.has(K(el))) paintThumb(K(el)); else el.classList.add('is-loading'); });
  if (!('IntersectionObserver' in window)) return els.forEach(el => wantThumb(K(el)));
  if (!THUMB.io) THUMB.io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting) { THUMB.io.unobserve(en.target); wantThumb(tkey(en.target.dataset.thumb, en.target.dataset.fig)); } }), { rootMargin: '300px 0px' });
  els.forEach(el => { if (!THUMB.mem.has(K(el))) THUMB.io.observe(el); });
}

  modal('Welcher Trainingstag?', `<p class="muted" style="margin:0 0 12px">${esc(e.n)} → ${esc(c.name)}</p><div class="pick-list">${days.map((d, i) => { const n = exercisesOf(d.id).length, full = n >= CONFIG.MAX_EXERCISES, has = exercisesOf(d.id).some(x => x.catalogId === e.id || norm(x.name) === norm(e.n));
    return `<button class="day-btn tap" data-action="ud-add-day" data-id="${e.id}" data-did="${d.id}" ${full ? 'disabled' : ''}><span class="day-no">${i + 1}</span><span class="grow"><span class="day-name">${esc(d.name)}</span><br><span class="muted" style="font-size:13px">${n} Übungen${has ? ' · bereits enthalten' : ''}${full ? ' · voll' : ''}</span></span>${ic('plus', 20)}</button>`; }).join('')}</div>`);

function addCatalogExercise(exId, dayId) {
  const e = KAT().find(x => x.id === exId), d = S.days.get(dayId); if (!e || !d) return;
  const list = exercisesOf(dayId); if (list.length >= CONFIG.MAX_EXERCISES) return toast('Dieser Tag ist voll');
  put('exercises', { id: uid(), dayId, name: e.n, order: list.length, createdAt: Date.now(), targetSets: CONFIG.DEFAULT_SETS, sets: [], note: '', catalogId: e.id,

const MEASURES = [

const SKINFOLDS = [
  { k: 'chest', l: 'Brust', h: 'diagonal, zwischen Achselfalte und Brustwarze' },
  { k: 'abdomen', l: 'Bauch', h: 'vertikal, ca. 2 cm neben dem Bauchnabel' },

/* Körperfett-Methoden: neue Formeln hier ergänzen. Die Methode wird mit jeder Messung gespeichert,

const BF_METHODS = {
  'jp7-siri': {
    name: 'Jackson & Pollock 7-Punkt + Siri',
    ref: 'Körperdichte nach Jackson & Pollock (1978, Männer) bzw. Jackson, Pollock & Ward (1980, Frauen); Umrechnung in Körperfett nach Siri (1956): KF % = 495 / Dichte − 450.',
    sites: SKINFOLDS.map(s => s.k),
    calc({ sum, sex, age }) {
      const d = sex === 'm'
        ? 1.112 - 0.00043499 * sum + 0.00000055 * sum * sum - 0.00028826 * age
        : 1.097 - 0.00046971 * sum + 0.00000056 * sum * sum - 0.00012828 * age;

const te = new TextEncoder();
const b64 = buf => { const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

  const salt = rnd(16), iv = rnd(12), key = await pbkdf(code, salt, 'key');
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));

}

  const key = await pbkdf(code, unb64(hdr.salt), 'key');
  let pt; try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(hdr.iv) }, key, unb64(hdr.ct)); }

const checkCmp = (a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0);

}
const valOf = (ch, k) => k === 'bf' ? (ch.bf && hasVal(ch.bf.pct) ? ch.bf.pct : null) : (ch.m && hasVal(ch.m[k]) ? ch.m[k] : null);

  const a = v[0], b = v[v.length - 1], d = r3(valOf(b, k) - valOf(a, k));
  return { start: valOf(a, k), cur: valOf(b, k), d, pct: valOf(a, k) ? Math.round(d / valOf(a, k) * 1000) / 10 : null, a, b, n: v.length };

/* ---------- Bilder verkleinern ---------- */
function resizePhoto(file, max = 1400, tmax = 360) {

    const url = URL.createObjectURL(file), img = new Image();

        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); return cv; };
      const big = draw(max), sm = draw(tmax);

/* =====================================================================
   SWEAT4 MAHLZEITEN – Tagesrhythmus & Baukasten
   Modelle: 5 Mahlzeiten (alle 2,5–3 Std., erste direkt nach dem Aufstehen, letzte 3 Std. –
   spätestens 2,5 Std. – vor dem Schlafen) · Intervallfasten 16:8 (3 Mahlzeiten) · 20:4 (2 Mahlzeiten).
   Trainingstage: 2 Std. vor dem Training nichts essen, direkt danach essen (Shake + Mahlzeit).
   Makros werden gleichmäßig auf die Mahlzeiten verteilt.
   ===================================================================== */
const MEAL_MODES = {
  '5': { label: '5 Mahlzeiten am Tag', short: '5 Mahlzeiten', n: 5 },
  '16': { label: 'Intervallfasten 16:8 (3 Mahlzeiten)', short: '16:8', n: 3, win: 480, starts: ['10:00', '11:00', '12:00', '13:00'] },
  '20': { label: 'Intervallfasten 20:4 (2 Mahlzeiten)', short: '20:4', n: 2, win: 240, starts: ['12:00', '13:00', '14:00', '15:00', '16:00'] },
};
const WEEKDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MEAL_DEFAULT = { mode: '5', wake: '07:00', sleep: '23:00', win: '12:00', train: '', days: [1, 3, 5] };
const TRAIN_MIN = 75;            // Training inkl. Umziehen
const NO_FOOD_BEFORE = 120;      // 2 Std. vor dem Training nichts essen
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
const toHM = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

const mealCfg = c => ({ ...MEAL_DEFAULT, ...(c.mealCfg || {}) });
const isTrainDay = (cfg, date = new Date()) => cfg.days.includes(date.getDay() || 7);
const FOODS = () => window.SW_FOODS || [];
const foodById = id => FOODS().find(f => f.id === id);

/* ---------- Tagesplan ---------- */
function mealSchedule(cfg, trainDay) {
  const M = MEAL_MODES[cfg.mode] || MEAL_MODES['5'], warn = [], hints = [];
  let sleep = toMin(cfg.sleep), wake = toMin(cfg.wake); if (sleep <= wake) sleep += 1440; // nach Mitternacht
  let meals, lastAllowed;
  if (cfg.mode === '5') {
    const first = wake + 30;
    let step = Math.min(180, (sleep - 180 - first) / 4);
    if (step < 150) step = Math.min(180, (sleep - 150 - first) / 4);
    if (step < 120) warn.push('Zwischen Aufstehen und Schlafengehen ist wenig Zeit – die Abstände liegen unter 2 Stunden.');
    meals = Array.from({ length: 5 }, (_, i) => ({ t: r15(first + i * step), i, share: 1 }));
    lastAllowed = sleep - 150;
  } else {
    const S = toMin(cfg.win) ?? toMin(M.starts[0]);
    const off = cfg.mode === '16' ? [0, 240, 450] : [0, 210];
    meals = off.map((o, i) => ({ t: S + o, i, share: 1 }));
    lastAllowed = Math.min(S + M.win, sleep - 150);
    if (S + M.win > sleep - 150) warn.push(`Das Essfenster endet um ${toHM(S + M.win)} – weniger als 2,5 Std. vor dem Schlafen. Ein früheres Fenster ist besser.`);
    hints.push(`Essfenster ${toHM(S)}–${toHM(S + M.win)} Uhr. Außerhalb nur Wasser, ungesüßter Tee oder schwarzer Kaffee.`);
  }
  let train = null;
  const T = trainDay ? toMin(cfg.train) : null;
  if (trainDay && T == null) hints.push('Trage im Rhythmus die Trainingszeit ein, dann richtet sich der Plan an Trainingstagen danach.');
  if (T != null) {
    const Tend = T + TRAIN_MIN; train = { t: T, end: Tend, stop: T - NO_FOOD_BEFORE };
    const pre = meals.filter(m => m.t <= T - NO_FOOD_BEFORE), post = meals.filter(m => m.t > T - NO_FOOD_BEFORE);
    const conflict = post.some(m => m.t < Tend);
    if (cfg.mode !== '5' && Tend > (toMin(cfg.win) ?? 0) + MEAL_MODES[cfg.mode].win) warn.push('Das Training liegt nach dem Essfenster. Lege das Fenster so, dass du nach dem Training noch essen kannst.');
    if (cfg.mode !== '5' && T < (toMin(cfg.win) ?? 0) && Tend <= (toMin(cfg.win) ?? 0) + 60) hints.push('Du trainierst vor dem Essfenster, also nüchtern. Die erste Mahlzeit direkt nach dem Training essen.');
    if (conflict && post.length) {

      while (n > 1 && step < 60) { n--; step = Math.min(180, span / (n - 1 || 1)); }
      const shares = Array(n).fill(1); for (let k = n; k < post.length; k++) shares[n - 1] += 1; // überzählige Mahlzeiten zusammenlegen
      if (n < post.length) warn.push(`Nach dem Training ist nicht genug Zeit für alle Mahlzeiten – ${post.length - n + 1} Portionen werden zur letzten Mahlzeit zusammengelegt.`);
      meals = [...pre, ...shares.map((sh, k) => ({ t: r15(start + k * step), i: post[k].i, share: sh, postWO: k === 0 }))];
    } else {
      const next = post.find(m => m.t >= Tend);
      if (next && next.t - Tend <= NO_FOOD_BEFORE) next.postWO = true;

    }

  const late = meals.filter(m => m.t > sleep - 150);
  if (late.length) warn.push(`Die Mahlzeit um ${toHM(late[late.length - 1].t)} liegt weniger als 2,5 Std. vor dem Schlafen – wegen des späten Trainings. Hier lieber etwas Leichtes wie einen Shake mit Quark.`);
  return { meals: meals.sort((a, b) => a.t - b.t), train, warn, hints, lastAllowed };

/* ---------- Mengen automatisch berechnen ---------- */
function mealTotals(items) {
  const t = { p: 0, c: 0, f: 0, fi: 0 };
  for (const it of items) { const f = foodById(it.id); if (!f) continue; const k = (it.g || 0) / 100; t.p += f.p * k; t.c += f.c * k; t.f += f.f * k; t.fi += f.fi * k; }

}
function autoFit(items, target) {

  if (whole.length && whole.length < items.filter(it => (foodById(it.id) || {}).k !== 'v').length) autoFitPass(items, target, false, new Set(whole));
  return items;
}
const isWhole = f => f.u && /^(Ei|Brötchen|Banane|Apfel|Orange|Wrap)/.test(f.u.l);

  const keys = ['p', 'c', 'f'], fixed = [], vars = [];
  items.forEach(it => { const f = foodById(it.id); if (!f) return; (f.k === 'v' || locked.has(it) ? fixed : vars).push({ it, f }); });
  fixed.forEach(({ it, f }) => { if (!it.g) it.g = f.fix || 100; });
  const base = mealTotals(fixed.map(x => x.it)), T = keys.map(k => Math.max(0, target[k] - base[k]));
  if (!vars.length) return items;
  const cnt = { p: 0, c: 0, f: 0 }; vars.forEach(v => cnt[v.f.k]++);
  const x = vars.map(({ f }) => { const k = f.k, ki = keys.indexOf(k); return cnt[k] ? Math.max(.05, T[ki] / cnt[k] / Math.max(f[k], 1)) : .3; });
  const x0 = x.slice(), sc = T.map(t => Math.max(t, 8)), lam = .02;
  for (let it = 0; it < 400; it++) for (let i = 0; i < x.length; i++) {
    let num = lam * x0[i], den = lam;

      const a = vars[i].f[keys[k]] / sc[k]; let rest = 0;
      for (let j = 0; j < x.length; j++) if (j !== i) rest += vars[j].f[keys[k]] * x[j];

    let g = x[i] * 100;
    if (isWhole(f)) g = Math.max(1, Math.round(g / f.u.g)) * f.u.g; // ganze Stücke
    else g = Math.max(5, Math.round(g / 5) * 5);
    it.g = g;

}

async function saveCheck(f) {

async function p3Load() {
  const el = document.getElementById('p360'); if (!el) return;
  await Promise.all(P3.ids.map(async (cid, k) => {
    const ids = photoIds(S.checks.get(cid)), imgs = el.querySelectorAll(`.p3-set[data-set="${k}"] img`);

    await Promise.all([...imgs].map(im => im.decode ? im.decode().catch(() => {}) : null));
  }));

}
function p3Apply() {
  const el = document.getElementById('p360'); if (!el) return;
  const p = ((P3.p % 4) + 4) % 4, i0 = Math.floor(p), f = p - i0;
  el.querySelectorAll('.p3-set').forEach(set => set.querySelectorAll('img').forEach((im, i) => {
    let o = 0, tx = 0, z = 0;
    if (i === i0) { o = 1; tx = -f * 5; z = 1; } else if (i === i0 + 1) { o = f; tx = (1 - f) * 5; z = 2; }
    im.style.opacity = o; im.style.zIndex = z; im.style.transform = `translate3d(${tx}%,0,0) scale(${1 - Math.abs(f - (i === i0 ? 0 : 1)) * 0.03})`;
  }));
  const near = Math.round(p) % 4;
  el.querySelectorAll('.p3-pos').forEach(b => b.classList.toggle('on', +b.dataset.v === near));
  const st = el.querySelector('#p3-stage');
  if (P3.mode === 'toggle') el.querySelectorAll('.p3-set').forEach(s => s.style.opacity = +s.dataset.set === P3.show ? 1 : 0);
  else el.querySelectorAll('.p3-set').forEach(s => s.style.opacity = '');
  const s1 = el.querySelector('.p3-set[data-set="1"]'), h = el.querySelector('#p3-handle');
  if (s1) s1.style.clipPath = P3.mode === 'slider' ? `inset(0 0 0 ${P3.slider}%)` : '';
  if (h) h.style.left = P3.slider + '%';
  st.className = 'p3-stage mode-' + P3.mode;
}
function p3Stop() { cancelAnimationFrame(P3.raf); P3.raf = 0; }
function p3Down(e) {
  const st = e.currentTarget; st.setPointerCapture(e.pointerId); p3Stop(); P3.play = false; p3PlayBtn();
  const slider = P3.mode === 'slider' && e.target.closest('#p3-handle');
  P3.drag = { x: e.clientX, p: P3.p, slider, w: st.clientWidth, left: st.getBoundingClientRect().left, lx: e.clientX, lt: performance.now() };
  P3.vel = 0;
}
function p3Move(e) {
  const d = P3.drag; if (!d) return;
  if (d.slider) { P3.slider = Math.max(0, Math.min(100, (e.clientX - d.left) / d.w * 100)); return p3Apply(); }
  const now = performance.now(), per = (P3.mode === 'side' ? d.w / 2 : d.w) * 0.55;
  P3.p = d.p - (e.clientX - d.x) / per;
  const dt = now - d.lt; if (dt > 0) P3.vel = Math.max(-0.003, Math.min(0.003, 0.8 * (-(e.clientX - d.lx) / per / dt) + 0.2 * P3.vel));
  d.lx = e.clientX; d.lt = now; p3Apply();
}
function p3Up() {
  const d = P3.drag; P3.drag = null; if (!d || d.slider) return;
  let last = performance.now();
  const step = t => {
    const dt = Math.min(40, t - last); last = t;
    if (Math.abs(P3.vel) > 0.0004) { P3.p += P3.vel * dt; P3.vel *= Math.pow(0.9, dt / 16); p3Apply(); P3.raf = requestAnimationFrame(step); }
    else p3To(Math.round(P3.p));
  };
  P3.raf = requestAnimationFrame(step);
}
function p3To(target) {
  p3Stop(); const from = P3.p, t0 = performance.now(), dur = 380;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); P3.p = from + (target - from) * e; p3Apply(); if (k < 1) P3.raf = requestAnimationFrame(step); };
  P3.raf = requestAnimationFrame(step);
}
function p3PlayBtn() { const b = document.getElementById('p3-play'); if (b) b.innerHTML = P3.play ? `${ic('pause', 14)} Stopp` : `${ic('play', 14)} Drehen`; }
function p3Play() {
  P3.play = !P3.play; p3PlayBtn(); p3Stop(); if (!P3.play) return p3To(Math.round(P3.p));
  let last = performance.now();
  const step = t => { if (!P3.play) return; P3.p += (t - last) * 0.0007; last = t; p3Apply(); P3.raf = requestAnimationFrame(step); };

function close360() {

/* ---------- Kundendatei (Trainer → Kunde) & Rückmeldung (Kunde → Trainer) ---------- */
async function clientPackage(cid) {
  flushSave();
  const c = S.clients.get(cid), plans = all('plans').filter(p => p.clientId === cid), pids = new Set(plans.map(p => p.id));
  const days = all('days').filter(d => pids.has(d.planId)), dids = new Set(days.map(d => d.id));
  const cc = { ...c, notes: '' }; delete cc.access;
  const photos = (await DB.photosOfClient(cid)).filter(p => p.clientId === cid);
  return { clientId: cid, clientName: c.name, exportedAt: new Date().toISOString(),
    data: { clients: [cc], plans, days, exercises: all('exercises').filter(e => dids.has(e.dayId)), sessions: all('sessions').filter(s => s.clientId === cid), checks: all('checks').filter(x => x.clientId === cid) }, photos };
}
/* Datenebene: prüft, dass ein Paket ausschließlich Daten EINES Kunden enthält */
function packageIsolated(pkg) {
  const cid = pkg.clientId, d = pkg.data, pids = new Set(d.plans.map(p => p.id)), dids = new Set(d.days.map(x => x.id));
  return d.clients.length === 1 && d.clients[0].id === cid && d.plans.every(p => p.clientId === cid) && d.days.every(x => pids.has(x.planId))
    && d.exercises.every(e => dids.has(e.dayId)) && d.sessions.every(s => s.clientId === cid) && d.checks.every(x => x.clientId === cid)
    && pkg.photos.every(p => p.clientId === cid && d.checks.some(x => x.id === p.checkId));
}

  UI.readyFile = { name, text };
  modal('Datei ist bereit', `<p class="muted" style="margin-top:0">${info}</p>

    <button class="btn btn-ghost btn-block" data-action="file-dl">${ic('download')} Herunterladen / in „Dateien“ sichern</button></div>`);
}
async function makePackage(cid, code) {
  const c = S.clients.get(cid), pkg = await clientPackage(cid);
  if (!packageIsolated(pkg)) throw new Error('Sicherheitsprüfung fehlgeschlagen – Datei wurde nicht erstellt.');
  if (boxUrl()) pkg.box = boxUrl();
  const text = await encryptPayload(pkg, code, { kind: 'client-package', v: 1, clientId: cid });
  c.access = { ...(c.access || {}), code, lastExport: Date.now() }; put('clients', c);
  return { name: `sweat4-zugang_${(c.name || 'kunde').replace(/[^\wäöüÄÖÜß-]+/g, '_')}_${today()}.json`, text, n: pkg.photos.length };
}
async function setupFromFile(file, code, opts = {}) {
  const h = await readHeader(file);
  if (h.kind !== 'client-package') throw new Error(h.kind === 'client-return' ? 'Das ist eine Rückmelde-Datei für den Trainer.' : 'Unbekannter Dateityp.');
  const role = roleInfo();
  if (role.value === 'client' && role.clientId !== h.clientId) throw new Error('Diese Datei gehört zu einem anderen Kunden.');
  if (role.value !== 'client' && S.clients.size) throw new Error('Auf diesem Gerät sind Trainerdaten gespeichert. Der Kunden-Zugang kann nur auf einem eigenen Gerät (ohne Trainerdaten) eingerichtet werden.');
  const pkg = await decryptPayload(h, code);
  if (pkg.clientId !== h.clientId || !packageIsolated(pkg)) throw new Error('Die Datei ist ungültig.');
  const map = new Map(pkg.data.sessions.map(s => [s.id, s]));
  if (role.value === 'client') for (const s of all('sessions')) { const o = map.get(s.id); if (s.clientId === pkg.clientId && (!o || (s.updatedAt || 0) > (o.updatedAt || 0))) map.set(s.id, s); }
  if (role.value === 'client') { const loc = S.clients.get(pkg.clientId), pc = pkg.data.clients && pkg.data.clients[0];
    if (loc && pc && (loc.mealsAt || 0) > (pc.mealsAt || 0)) Object.assign(pc, { mealCfg: loc.mealCfg, meals: loc.meals, mealsAt: loc.mealsAt }); } // eigene Mahlzeiten bleiben erhalten
  const lock = await makeLock(code);
  const boxU = pkg.box || opts.box || boxUrl();
  const meta = [{ id: 'role', value: 'client', clientId: pkg.clientId, since: Date.now() }, lock, { id: 'pkgInfo', exportedAt: pkg.exportedAt, boxV: opts.boxV || 0 }];
  if (boxU) meta.push({ id: 'box', url: boxU }); const upM = S.meta.get('boxUp'); if (upM) meta.push(upM);
  await DB.replaceAll({ ...pkg.data, sessions: [...map.values()], meta, photos: pkg.photos });
  PH.clear(); await loadAll(); LOCK.init = true; LOCK.locked = false; UI.open = {}; BOX.code = code;
}
async function makeReturn(code) {
  if (!(await verifyLock(code))) throw new Error('Falscher Zugangscode.');
  flushSave();
  const cid = roleInfo().clientId, c = S.clients.get(cid);
  const sessions = all('sessions').filter(s => s.clientId === cid && s.status === 'done');
  const text = await encryptPayload({ clientId: cid, sessions, meals: c.meals || null, mealCfg: c.mealCfg || null, mealsAt: c.mealsAt || 0, exportedAt: new Date().toISOString() }, code, { kind: 'client-return', v: 1, clientId: cid });
  return { name: `sweat4-trainings_${(c.name || 'kunde').replace(/[^\wäöüÄÖÜß-]+/g, '_')}_${today()}.json`, text, n: sessions.length };
}
async function importReturn(file, codeIn) {
  const h = await readHeader(file);
  if (h.kind !== 'client-return') throw new Error(h.kind === 'client-package' ? 'Das ist eine Zugangsdatei für Kunden, keine Rückmeldung.' : 'Unbekannter Dateityp.');
  const c = S.clients.get(h.clientId); if (!c) throw new Error('Dieser Kunde existiert auf diesem Gerät nicht.');
  const code = codeIn || (c.access && c.access.code); if (!code) throw new Error('Kein Zugangscode für diesen Kunden hinterlegt.');
  const p = await decryptPayload(h, code);
  if (p.clientId !== c.id || !Array.isArray(p.sessions)) throw new Error('Die Datei ist ungültig.');
  let neu = 0, upd = 0, rej = 0;
  for (const s of p.sessions) {
    if (!s || s.clientId !== c.id || !Array.isArray(s.exercises) || !s.id) { rej++; continue; } // Datenebene: fremde Datensätze werden abgewiesen
    const ex = S.sessions.get(s.id);
    if (ex && ex.clientId !== c.id) { rej++; continue; }
    if (!ex) { put('sessions', s); neu++; } else if ((s.updatedAt || 0) > (ex.updatedAt || 0)) { put('sessions', s); upd++; }
  }
  let meals = false;
  if (p.mealsAt && p.mealsAt > (c.mealsAt || 0)) { const cc = S.clients.get(c.id); Object.assign(cc, { meals: p.meals, mealCfg: p.mealCfg, mealsAt: p.mealsAt }); put('clients', cc); meals = true; }
  return { c, neu, upd, rej, meals };
}


/* ---------- Briefkasten: verschlüsselter Online-Austausch (optional) ----------
   Daten werden auf dem Gerät mit dem Zugangscode verschlüsselt (AES-GCM), der Briefkasten sieht nur Datensalat.
   Adresse im Briefkasten = SHA-256(Kunden-ID + Code); Schreibrecht nur mit einem zweiten, ebenfalls aus dem Code abgeleiteten Schlüssel. */
const BOX = { code: null, checked: {}, pending: null };
const boxUrl = () => { const m = S.meta.get('box'); return m && m.url ? String(m.url).trim().replace(/\/+$/, '') : ''; };
const hexOf = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function boxKeys(cid, code) {
  const h = str => crypto.subtle.digest('SHA-256', te.encode(str)).then(hexOf);
  return { id: await h(`sweat4-box|${cid}|${code}`), token: await h(`sweat4-write|${cid}|${code}`) };
}
async function boxPut(cid, code, slot, text) {
  const u = boxUrl(); if (!u) throw new Error('Kein Briefkasten eingerichtet.');
  const k = await boxKeys(cid, code);

      busy(f, true); const was = isClientMode(), code = String(fd.get('code') || '');
      if (f.dataset.cid) {
        const res = await boxGet(f.dataset.cid, code, 'down', 0, f.dataset.box);
        if (!res || res.missing) throw new Error('Kein Zugang gefunden. Prüfe den Code – oder frag deinen Trainer, ob er dich eingeladen hat.');
        await setupFromFile(textFile(res.data), code, { boxV: res.v, box: f.dataset.box });
      } else await setupFromFile(file, code);
      if (!was) put('meta', { id: 'consent', at: Date.now() });
      toast(was ? 'Update geladen ✓' : 'Willkommen! Dein Zugang ist eingerichtet ✓'); go('/'); render(); return;
    }
  } catch (e) { busy(f, false); toast(e && e.message || String(e)); }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.pslot != null && t.files && t.files[0]) {
    const i = +t.dataset.pslot;
    try { const r = await resizePhoto(t.files[0]); const old = UI.cd.photos[i]; if (old && old.id) UI.cd.removed.push(old.id); UI.cd.photos[i] = r; refreshSlot(i); }
    catch (e) { toast(e.message); }
  } else if (t.dataset.p3sel != null) {
    const ids = P3.ids.slice(); ids[+t.dataset.p3sel] = t.value; const p = P3.p; await open360(ids); P3.p = p; p3Apply();
  } else if (t.name === 'bfOn' && t.form && t.form.dataset.form === 'check') {
    UI.cd.bfOn = t.checked; document.getElementById('bf-box').classList.toggle('hidden', !t.checked);
  } else if (t.id === 'ret-file' && t.files[0]) {
    const file = t.files[0]; t.value = '';
    try {
      let r; try { r = await importReturn(file); }
      catch (e) { if (!/Zugangscode/.test(e.message)) throw e; const code = await promptDialog('Zugangscode', { label: 'Code des Kunden', ok: 'Importieren' }); if (!code) return; r = await importReturn(file, code); }
      toast(`${r.c.name}: ${r.neu} neue, ${r.upd} aktualisierte Trainings${r.rej ? ` · ${r.rej} abgewiesen` : ''}`); render();
    } catch (e) { toast(e.message); }
  } else if (t.form && t.form.dataset.form === 'setup' && t.type === 'file' && t.files[0]) {
    const s = document.querySelector('#setup-pick span'); if (s) s.textContent = '✓ ' + t.files[0].name;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if ((t.dataset.sf != null || t.name === 'date') && t.form && t.form.dataset.form === 'check') { const c = S.clients.get(t.form.dataset.cid), l = document.getElementById('bf-live'); if (c && l) l.innerHTML = bfLiveHtml(c); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (document.getElementById('p360') || document.getElementById('pview'))) close360(); });
window.addEventListener('hashchange', () => close360());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { LOCK.hiddenAt = Date.now(); return; }
  if (S.meta.get('lock') && LOCK.hiddenAt && Date.now() - LOCK.hiddenAt > 5 * 60000 && !LOCK.locked) { LOCK.locked = true; render(); }
});

(async function init() {
  // Offline-Fähigkeit, sobald die App über eine Web-Adresse geöffnet wird
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { await DB.open(); await loadAll(); render(); }
  catch (e) {
    document.getElementById('app').innerHTML = `<main class="wrap"><div class="card" style="margin-top:30px"><h2>Speicher nicht verfügbar</h2>
      <p class="muted">Der Browser erlaubt keine lokale Datenbank (IndexedDB). Häufige Ursachen: privater/Inkognito-Modus oder eine Vorschau-Ansicht. Bitte öffne die Datei direkt in Chrome, Edge, Firefox oder Safari.</p>
      <p class="muted" style="font-size:13px">Fehler: ${esc(e && e.message || e)}</p></div></main>`;
  }
})();
</script>
</body>
</html>
